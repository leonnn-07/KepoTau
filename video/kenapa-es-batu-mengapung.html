<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kenapa Es Mengapung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1B4B;--ink:#16132E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0a1a;overflow:hidden;font-family:Poppins,system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1080px;height:1920px;background:var(--bg);overflow:hidden;transform-origin:center}
.scene{position:absolute;inset:0}
.scene svg.art{position:absolute;inset:0;width:1080px;height:1920px}
.badge{position:absolute;top:150px;left:50%;transform:translateX(-50%);padding:8px 30px;border:3px solid #FBBF24;border-radius:999px;color:#FBBF24;font-weight:700;font-size:30px;letter-spacing:1px;z-index:3;white-space:nowrap}
.wm{position:absolute;right:40px;bottom:40px;color:rgba(255,255,255,.85);font-weight:700;font-size:28px;z-index:3}
.cap{position:absolute;left:40px;right:40px;top:290px;text-align:center;z-index:3}
.small{color:#F8FAFC;font-weight:500;font-size:54px;line-height:1.25}
.big{font-weight:900;font-size:128px;line-height:1.08;text-transform:uppercase;white-space:nowrap;margin-top:6px;letter-spacing:-1px}
.ctaw{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;z-index:3}
.cta{background:#F8FAFC;color:var(--ink);font-weight:700;font-size:44px;padding:30px 90px;border-radius:999px;z-index:3;white-space:nowrap}
.outro{background:var(--bg)}
.outro svg{position:absolute;inset:0;width:1080px;height:1920px}
.outro .tag{position:absolute;left:0;right:0;top:1080px;text-align:center;color:#F8FAFC;font-weight:500;font-size:50px}
.outro .socials{position:absolute;left:0;right:0;top:1170px;display:flex;flex-direction:column;align-items:center;gap:34px}
.outro .soc{display:flex;align-items:center;gap:28px;color:#F8FAFC;font-weight:700;font-size:56px;white-space:nowrap}
.outro .soc svg{position:static;width:92px;height:92px;flex:none}
/* outro: logo tergambar (outline) lalu terisi cairan dari bawah */
.draw{stroke-dasharray:1400;animation:draw 1.1s ease-in-out both}
.fillup{animation:fillup 1.3s cubic-bezier(.45,0,.2,1) both;animation-delay:var(--d,1s)}
.wave{animation:wave 1.2s linear infinite}
@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes fillup{from{transform:translateY(160px)}to{transform:translateY(-220px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-240px)}}
#play{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;font:800 28px Poppins,sans-serif;padding:22px 48px;border-radius:999px;border:0;background:#FBBF24;color:#16132E;cursor:pointer}
#bar{position:fixed;left:0;bottom:0;height:5px;background:#FBBF24;z-index:20;width:0}
body.render #play,body.render #bar{display:none}

/* ---- animasi masuk (pakai lewat A('pop', delay, ...)) ---- */
.pop,.fade,.rise,.slideL,.slideR,.grow{animation-duration:.55s;animation-fill-mode:both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.pop{animation-name:pop;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
.fade{animation-name:fade;animation-timing-function:ease}
.rise{animation-name:rise;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.slideL{animation-name:slideL;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.slideR{animation-name:slideR;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.grow{animation-name:grow;transform-origin:bottom center;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideL{from{transform:translateX(-160px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(160px);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
/* ---- animasi berulang ---- */
.bob{animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.sway{animation:sway 2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center;animation-delay:var(--d,0s)}
.wiggle{animation:wiggle 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center;animation-delay:var(--d,0s)}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;animation-delay:var(--d,0s)}
.flow{animation:flow 1.4s linear infinite}
.fall{animation:fall var(--dur,.8s) linear infinite;animation-delay:var(--d,0s)}
.drift{animation:drift var(--dur,2s) ease-out infinite;animation-delay:var(--d,0s)}
.walk{animation:walk var(--dur,3s) ease-in-out both;animation-delay:var(--d,0s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes flow{to{stroke-dashoffset:-104}}
@keyframes fall{from{transform:translateY(-250px)}to{transform:translateY(2100px)}}
@keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes walk{from{transform:translateX(var(--from,400px))}to{transform:none}}
@keyframes glitch{0%{text-shadow:-6px 0 #25F4EE,6px 0 #FE2C55}50%{text-shadow:6px 0 #25F4EE,-6px 0 #FE2C55}100%{text-shadow:-3px 0 #25F4EE,3px 0 #FE2C55}}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<button id="play">▶ PUTAR</button>
<div id="bar"></div>
<script>
/* =====================================================================
   BAGIAN YANG DIISI — hanya CONFIG dan SCENES. Engine di bawah jangan diubah.
   Koordinat art: kanvas 1080 x 1920. Tanah mulai di y = G (1520).
   ===================================================================== */
const CONFIG = {
  brand: "KepoTau",
  brandSplit: 4,
  tagline: "",
  handle: "@kepotau.ofc",
  socials: [
    { icon: "tiktok", handle: "@kepotau.ofc" },
    { icon: "instagram", handle: "@kepotau.ofc" },
  ],
  ground: false,
};

/* ---------- helper khusus topik es ---------- */
const K_ = '#16132E';
/** durasi scene dari panjang kalimat VO (± 2,7 kata/detik + jeda) agar muat dibacakan */
const D = t => Math.max(2.6, +(t.split(/\s+/).length / 2.7 + 1).toFixed(1));
/** Es batu (kubus) */
const ice = (x,y,s=1,rot=0) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><rect x="-55" y="-55" width="110" height="110" rx="22" fill="#E0F2FE" stroke="${K_}" stroke-width="5"/><path d="M-32 -30 L-10 -30" stroke="#fff" stroke-width="10" stroke-linecap="round"/><rect x="-40" y="-12" width="22" height="34" rx="8" fill="#fff" opacity=".7"/></g>`;
/** Gelas berisi air (level 0..1); inner digambar di koordinat absolut */
const glass = (x,y,w=380,h=480,level=.7,inner='') => { const id='gl'+(x|0)+(y|0); const wy=y+h/2-h*level;
  return `<clipPath id="${id}"><path d="M${x-w/2} ${y-h/2} L${x+w/2} ${y-h/2} L${x+w/2-30} ${y+h/2} L${x-w/2+30} ${y+h/2}Z"/></clipPath>
  <g clip-path="url(#${id})"><rect x="${x-w/2}" y="${wy}" width="${w}" height="${h}" fill="#7DD3FC" opacity=".55"/><rect x="${x-w/2}" y="${wy}" width="${w}" height="10" fill="#BAE6FD"/>${inner}</g>
  <path d="M${x-w/2} ${y-h/2} L${x-w/2+30} ${y+h/2} L${x+w/2-30} ${y+h/2} L${x+w/2} ${y-h/2}" fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linejoin="round"/>`; };
/** Molekul air: O merah + 2 H putih. face = wajah iseng */
const mol = (x,y,s=1,face=false,rot=0) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><circle cx="-40" cy="-34" r="26" fill="#F8FAFC" stroke="${K_}" stroke-width="5"/><circle cx="40" cy="-34" r="26" fill="#F8FAFC" stroke="${K_}" stroke-width="5"/><circle r="46" fill="#F87171" stroke="${K_}" stroke-width="5"/>${face?`<circle cx="-14" cy="-4" r="6" fill="${K_}"/><circle cx="14" cy="-4" r="6" fill="${K_}"/><path d="M-14 16 Q0 28 16 12" fill="none" stroke="${K_}" stroke-width="5" stroke-linecap="round"/>`:''}</g>`;
const hb = (x1,y1,x2,y2) => `<path class="flow" d="M${x1} ${y1} L${x2} ${y2}" stroke="#6EE7B7" stroke-width="7" stroke-dasharray="14 10" stroke-linecap="round"/>`;
/** Kisi heksagon: molekul di 6 sudut, ikatan di sisi. */
const hexRing = (cx,cy,r=150,s=.55) => { const P=[...Array(6)].map((_,i)=>[cx+r*Math.cos(Math.PI/6+i*Math.PI/3), cy+r*Math.sin(Math.PI/6+i*Math.PI/3)]);
  return P.map((p,i)=>hb(...p,...P[(i+1)%6])).join('') + P.map((p,i)=>mol(p[0],p[1],s,false,i*60)).join(''); };
/** Molekul berdesakan acak (cair) */
const crowd = (cx,cy,w,h,n,s=.42) => { let o=''; for(let i=0;i<n;i++){ const x=cx-w/2+((i*.7548777+.3)%1)*w, y=cy-h/2+((i*.5698403+.6)%1)*h; o+=`<g class="wiggle" style="--d:-${(i%5)*.2}s">${mol(x,y,s,false,(i*47)%360)}</g>`; } return o; };
/** Botol */
const bottle = (x,y,s=1,crack=false) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-30 -230 H30 V-170 C30 -140 80 -130 80 -80 V200 Q80 230 50 230 H-50 Q-80 230 -80 200 V-80 C-80 -130 -30 -140 -30 -170Z" fill="#BAE6FD" fill-opacity=".5" stroke="#F8FAFC" stroke-width="8"/><rect x="-72" y="-40" width="144" height="262" rx="10" fill="#E0F2FE"/>${crack?`<path d="M-20 -60 L5 -10 L-15 30 L20 80 L0 130 M5 -10 L40 10" stroke="${K_}" stroke-width="6" fill="none" stroke-linecap="round"/>`:''}<rect x="-34" y="-262" width="68" height="34" rx="8" fill="#60A5FA" stroke="${K_}" stroke-width="5"/></g>`;
/** Ikan */
const fish = (x,y,s=1,c='#FB923C',dir=1) => `<g transform="translate(${x} ${y}) scale(${s*dir} ${s})"><path d="M-60 0 L-95 -30 L-95 30Z" fill="${c}" stroke="${K_}" stroke-width="4" stroke-linejoin="round"/><ellipse rx="65" ry="38" fill="${c}" stroke="${K_}" stroke-width="4"/><circle cx="35" cy="-8" r="7" fill="${K_}"/><path d="M0 -36 Q15 -55 30 -34" fill="${c}" stroke="${K_}" stroke-width="4"/></g>`;
/** Penampang danau: es di atas (frozen=false) atau beku total (true) */
const lake = (cx,cy,w=860,h=560,frozen=false) => { const id='lk'+(frozen?1:0)+(cx|0);
  const basin=`M${cx-w/2} ${cy-h/2} L${cx+w/2} ${cy-h/2} L${cx+w/2-90} ${cy+h/2} L${cx-w/2+90} ${cy+h/2}Z`;
  return `<rect x="${cx-w/2-40}" y="${cy-h/2}" width="${w+80}" height="${h+60}" fill="#6B4423"/><clipPath id="${id}"><path d="${basin}"/></clipPath>
  <g clip-path="url(#${id})"><rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" fill="${frozen?'#CFEFFF':'#3B82C4'}"/>${frozen?'':`<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="90" fill="#E0F2FE"/>`}</g>
  <path d="${basin}" fill="none" stroke="${K_}" stroke-width="6"/><rect x="${cx-w/2-40}" y="${cy-h/2-14}" width="${w+80}" height="16" fill="#8A5A33"/>`; };
/** Gunung es di laut */
const iceberg = (cx,cy) => `<rect x="90" y="${cy-150}" width="900" height="560" fill="#1D5D9B" rx="20"/><rect x="90" y="${cy-150}" width="900" height="14" fill="#7DD3FC"/>
  <path d="M${cx-60} ${cy-150} L${cx-20} ${cy-260} L${cx+30} ${cy-215} L${cx+70} ${cy-150}Z" fill="#F0F9FF" stroke="${K_}" stroke-width="5" stroke-linejoin="round"/>
  <path d="M${cx-60} ${cy-150} L${cx-210} ${cy+30} L${cx-150} ${cy+300} L${cx+60} ${cy+360} L${cx+230} ${cy+190} L${cx+180} ${cy-20} L${cx+70} ${cy-150}Z" fill="#BAE6FD" fill-opacity=".85" stroke="${K_}" stroke-width="5" stroke-linejoin="round"/>`;

const SCENES = [
  { small:"harusnya es itu", big:"TENGGELAM", color:"yellow",
    art: C => glass(540,1100,420,520,.72) + A('rise',.2, ice(540,800,1.05,8)) + A('pop',.6, C.arrow(540,890,540,1160,'white')) },
  { small:"tapi kok malah", big:"NGAMBANG?", color:"blue",
    art: C => glass(540,1100,420,520,.72, `<g class="bob">${ice(540,985,1.05,8)}</g>`) + A('pop',.5, C.qmark(820,800,.9)) },
  { small:"padahal kebanyakan zat", big:"MAKIN RAPAT SAAT BEKU", color:"mint",
    art: C => A('fade',.2, C.panel(290,1080,400,520,'cair','blue', crowd(290,1100,300,360,9,.4))) + A('fade',.6, C.panel(790,1080,400,520,'padat','mint', crowd(790,1150,200,200,12,.4))) + A('pop',.9, C.arrow(510,1080,580,1080,'white')) },
  { small:"contohnya lilin, yang padat malah", big:"TENGGELAM", color:"orange",
    art: C => A('pop',.2, C.panel(540,1080,560,560,'lilin cair','orange', `<rect x="260" y="880" width="560" height="480" fill="#F5D9A8"/><rect x="${470}" y="1240" width="140" height="70" rx="12" fill="#E8B96A" stroke="${K_}" stroke-width="5"/>`)) + A('rise',.7, C.pill(700,1210,'lilin padat','orange')) },
  { small:"tapi air beda sendiri, dia", big:"SI PEMBERONTAK", color:"red",
    art: C => A('pop',.2, A('bob',0, mol(540,1050,2.4,true))) + A('rise',.6, C.pill(540,1260,'H₂O','red',36)) + A('pop',.8, C.sparkle(780,900)) },
  { small:"ternyata gara-garanya ada di", big:"BENTUK MOLEKULNYA", color:"yellow",
    art: C => A('pop',.2, C.magnifier(540,1060,260, mol(540,1090,2.6), {bg:'#2A2660'})) + A('rise',.7, C.pill(360,1380,'O = oksigen','red')) + A('rise',.85, C.pill(720,1380,'H = hidrogen','white')) },
  { small:"molekul air suka", big:"GANDENGAN TANGAN", color:"mint",
    art: C => A('fade',.4, hb(400,960,680,960)+hb(400,960,540,1200)+hb(680,960,540,1200)) + A('pop',.1, mol(400,960,1)) + A('pop',.2, mol(680,960,1,false,40)) + A('pop',.3, mol(540,1200,1,false,-30)) },
  { small:"gandengan ini namanya", big:"IKATAN HIDROGEN", color:"mint",
    art: C => hb(400,960,680,960)+hb(400,960,540,1200)+hb(680,960,540,1200) + mol(400,960,1) + mol(680,960,1,false,40) + mol(540,1200,1,false,-30) + A('pop',.4, C.pill(540,900,'ikatan hidrogen','mint',34)) },
  { small:"waktu air masih cair, gandengannya", big:"LEPAS-PASANG", color:"blue",
    art: C => crowd(540,1080,620,560,12,.55) + A('fade',.5, `<g class="pulse">${hb(330,900,470,980)}</g><g class="pulse" style="--d:-.5s">${hb(620,1150,760,1230)}</g>`) },
  { small:"jadi molekulnya bisa", big:"DEMPET-DEMPETAN", color:"blue",
    art: C => glass(540,1100,420,520,.85, crowd(540,1150,330,380,16,.42)) },
  { small:"tapi pas membeku, mereka", big:"BARIS RAPI", color:"mint",
    art: C => A('pop',.2, hexRing(540,1080,170,.62)) + A('fade',.6, C.flake(860,820)) },
  { small:"polanya", big:"SEGI ENAM", color:"mint",
    art: C => hexRing(540,1080,170,.62) + A('pop',.3, hexRing(250,1080,170,.62)) + A('pop',.45, hexRing(830,1080,170,.62)) + A('pop',.7, C.sparkle(540,780)) },
  { small:"dan di tengahnya ada", big:"RUANG KOSONG", color:"yellow",
    art: C => hexRing(540,1080,170,.62) + A('pop',.3, C.magnifier(540,1080,110,'', {bg:'#1E1B4B'})) + A('rise',.7, C.pill(540,1300,'kosong = lebih ringan','yellow')) },
  { small:"makanya es lebih", big:"RINGAN DARI AIR", color:"blue",
    vo:"makanya es lebih ringan dari air",
    art: C => `<line x1="200" y1="1340" x2="880" y2="1340" stroke="#F8FAFC" stroke-width="6"/>` + C.bar(380,1340,560,'blue','air ±1,00',.3,180) + C.bar(700,1340,515,'#E0F2FE','es ±0,92',.6,180) + A('fade',1, C.text(540,720,'massa jenis (g/cm³)',{size:34,color:'gray',weight:600})) },
  { small:"pas membeku, air", big:"MEMUAI ±9%", color:"orange",
    vo:"pas membeku, air memuai sekitar sembilan persen",
    art: C => `<rect x="380" y="900" width="320" height="320" rx="20" fill="#7DD3FC" stroke="${K_}" stroke-width="5"/>` + A('pop',.6, `<rect x="365" y="870" width="350" height="350" rx="24" fill="none" stroke="#FB923C" stroke-width="7" stroke-dasharray="18 12"/>`) + A('pop',.9, C.chip(540,1350,'+9%','orange')) },
  { small:"itu sebabnya botol di freezer", big:"BISA RETAK", color:"red",
    art: C => A('pop',.2, bottle(540,1080,1.15,false)) + A('fade',.7, bottle(540,1080,1.15,true)) + A('pop',1, C.cross(800,880,.9)) },
  { small:"dan gunung es, sekitar", big:"90% DI BAWAH AIR", color:"blue",
    vo:"dan gunung es, sekitar sembilan puluh persennya ada di bawah air",
    art: C => A('fade',.1, iceberg(540,1000)) + A('rise',.7, C.pill(820,1250,'±90% tersembunyi','white')) },
  { small:"uniknya lagi, air paling padat di", big:"SUHU 4°C", color:"yellow",
    vo:"uniknya lagi, air paling padat di suhu empat derajat celcius",
    art: C => A('pop',.2, C.thermo(540,1120,1.6,.35,'blue')) + A('rise',.7, C.pill(760,1000,'4°C','yellow',40)) },
  { small:"jadi pas danau membeku, esnya", big:"DI ATAS", color:"blue",
    art: C => A('fade',.1, lake(540,1150)) + A('rise',.6, C.pill(540,830,'es','white')) },
  { small:"es itu jadi", big:"SELIMUT", color:"mint",
    art: C => lake(540,1150) + A('rise',.3, C.pill(540,1250,'air ±4°C','blue')) + A('pop',.6, C.pill(540,830,'selimut es','mint')) },
  { small:"ikan di bawahnya", big:"TETAP HIDUP", color:"mint",
    art: C => lake(540,1150) + A('slideL',.2, A('bob',0, fish(420,1180,1))) + A('slideR',.4, A('bob',0, fish(690,1300,.8,'#FBBF24',-1),'--d:-1s')) + A('pop',.9, C.check(860,920,.8)) },
  { small:"coba kalau es tenggelam, danau bisa", big:"BEKU TOTAL", color:"red",
    art: C => lake(540,1150,860,560,true) + A('fade',.3, `<g opacity=".5">${fish(540,1250,.9,'#94A3B8')}</g>`) + A('pop',.8, C.cross(860,920,.8)) },
  { small:"jadi, es ngambang itu sebenarnya", big:"PENYELAMAT KEHIDUPAN", color:"yellow",
    art: C => lake(540,1150) + A('bob',0, fish(470,1200,1)) + A('bob',0, fish(680,1310,.75,'#FBBF24',-1),'--d:-1s') + A('pop',.5, C.sparkle(540,780,1.2)) },
  { small:"selain air, ada juga yang", big:"MEMUAI SAAT BEKU", color:"orange",
    art: C => A('pop',.3, C.chip(240,1050,'besi','gray',50)) + A('pop',.45, C.chip(540,1050,'galium','yellow',50)) + A('pop',.6, C.chip(840,1050,'lilin','orange',50)) + A('pop',.9, C.qmark(540,1320,.9)) },
  { small:"menurut kamu yang mana?", big:"TULIS DI KOMENTAR!", color:"yellow", cta:"tulis di komentar", ctaDelay:.6,
    vo:"menurut kamu yang mana? tulis di komentar!",
    art: C => C.chip(240,1050,'besi','gray',50) + C.chip(540,1050,'galium','yellow',50) + C.chip(840,1050,'lilin','orange',50) + A('pop',.3, C.qmark(540,1320,.9)) },
  { type: "outro", dur: 3.5 },
].map(s => s.type ? s : { ...s, dur: D(s.vo || (s.small + ' ' + s.big)) });

/* =====================================================================
   ENGINE — tidak perlu diubah
   ===================================================================== */
const G = 1520, XF = 0.4, INK = '#16132E', BG = '#1E1B4B';
const COLORS = { yellow:'#FBBF24', purple:'#A78BFA', mint:'#6EE7B7', blue:'#7DD3FC', red:'#F87171',
  orange:'#FB923C', white:'#F8FAFC', pink:'#F9A8D4', green:'#9BC26B', brown:'#6B4423', gray:'#94A3B8' };
const col = c => COLORS[c] || c || COLORS.yellow;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let _seed = 7;
const rnd = () => { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; };
let _uid = 0;

/** SFX(nama, isi): paksa sound effect tertentu saat isi muncul (pop pop2 whoosh swish ding buzz boing rise sparkle). */
function SFX(name, inner){ return `<g data-sfx="${name}">${inner}</g>`; }
/** A(kelas, delay, isi): bungkus elemen dengan animasi masuk/berulang. */
function A(cls, d, inner, extra=''){ return `<g class="${cls}" style="--d:${d||0}s;${extra}">${inner}</g>`; }

const C = {
  /** Teks bebas. opt: {size, color, weight, anchor} */
  text(x,y,str,o={}){ return `<text x="${x}" y="${y}" font-family="Poppins,sans-serif" font-size="${o.size||40}" font-weight="${o.weight||700}" fill="${col(o.color||'white')}" text-anchor="${o.anchor||'middle'}" dominant-baseline="middle">${esc(str)}</text>`; },
  cloud(x,y,s=1,fill='#8B83D6'){ return `<g transform="translate(${x} ${y}) scale(${s})"><g class="bob" style="--d:-${(x%7)/3}s"><g fill="${fill}"><circle cx="-80" cy="20" r="62"/><circle cx="0" cy="-25" r="85"/><circle cx="85" cy="15" r="66"/><rect x="-140" y="10" width="285" height="72" rx="36"/></g></g></g>`; },
  sun(x,y,s=1){ let r=''; for(let i=0;i<12;i++){const a=i*Math.PI/6;r+=`<line x1="${Math.cos(a)*100}" y1="${Math.sin(a)*100}" x2="${Math.cos(a)*135}" y2="${Math.sin(a)*135}"/>`;}
    return `<g transform="translate(${x} ${y}) scale(${s})"><g class="spin" stroke="#FBBF24" stroke-width="12" stroke-linecap="round">${r}</g><circle r="75" fill="#FBBF24"/></g>`; },
  /** Hujan. kind 'light'|'heavy'. box opsional {x,y,w,h} untuk membatasi area. */
  rain(kind='light',box){ const b=box||{x:0,y:0,w:1080,h:G}; const id='c'+(++_uid); const n=kind==='heavy'?60:30, len=kind==='heavy'?80:45;
    let s=`<clipPath id="${id}"><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/></clipPath><g clip-path="url(#${id})" stroke="rgba(255,255,255,.4)" stroke-width="${kind==='heavy'?5:3}" stroke-linecap="round">`;
    const dur=kind==='heavy'?.55:.9;
    for(let i=0;i<n;i++){const x=b.x+rnd()*b.w;const y=b.y-50-rnd()*200;s+=`<g class="fall" style="--dur:${dur}s;--d:-${(rnd()*dur*2).toFixed(2)}s"><line x1="${x}" y1="${y}" x2="${x}" y2="${y+len}"/></g>`;}
    return s+'</g>'; },
  /** Tanah. type 'normal'|'dry'|'wet'. Biasanya otomatis lewat CONFIG.ground / scene.ground. */
  ground(type='normal'){ const base={normal:'#6B4423',dry:'#7D5432',wet:'#4F321B'}[type]||'#6B4423'; _seed=11; let s=`<rect x="0" y="${G}" width="1080" height="290" fill="${base}"/><rect x="0" y="${G}" width="1080" height="10" fill="#8A5A33"/><rect x="0" y="${G+286}" width="1080" height="6" fill="${INK}"/>`;
    for(let i=0;i<70;i++){s+=`<ellipse cx="${(rnd()*1080).toFixed(0)}" cy="${(G+20+rnd()*250).toFixed(0)}" rx="${(5+rnd()*10).toFixed(0)}" ry="${(3+rnd()*5).toFixed(0)}" fill="${rnd()>.5?'#8C5E36':'#3E2614'}" opacity=".8"/>`;}
    if(type==='dry'){for(let i=0;i<7;i++){let x=60+i*150+rnd()*40,y=G,p=`M${x} ${y}`;for(let k=0;k<4;k++){x+=(rnd()-.5)*50;y+=25+rnd()*20;p+=` L${x.toFixed(0)} ${y.toFixed(0)}`;}s+=`<path d="${p}" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round"/>`;}}
    return s; },
  sprout(x,y=G,wilt=false){ const c=wilt?'#B9A35A':'#9BC26B'; return `<g transform="translate(${x} ${y})"><g class="sway"><path d="M0 0 V-60" stroke="${INK}" stroke-width="5"/><path d="M0 -40 C-40 -50 -55 -85 -45 -95 C-15 -90 -5 -60 0 -40Z" fill="${c}" stroke="${INK}" stroke-width="3"/><path d="M0 -55 C30 -70 45 -100 38 -110 C10 -105 0 -80 0 -55Z" fill="${c}" stroke="${INK}" stroke-width="3"/></g></g>`; },
  /** Kepala manusia profil samping. dir 1 = menghadap kanan, -1 = kiri. */
  face(x,y,s=1,dir=1){ return `<g transform="translate(${x} ${y}) scale(${s*dir} ${s})" stroke="${INK}" stroke-width="5" stroke-linejoin="round">
    <rect x="-38" y="85" width="76" height="80" fill="#F2B98B"/>
    <path d="M-100 0 C-100 -80 -50 -125 15 -125 C80 -125 110 -75 110 -25 L150 30 L108 42 C100 95 60 120 0 120 C-60 120 -100 75 -100 0Z" fill="#F2B98B"/>
    <path d="M-104 15 C-118 -85 -45 -142 30 -128 C78 -120 95 -100 88 -82 C40 -95 -10 -80 -38 -40 C-58 -12 -70 18 -104 15Z" fill="#2B2238"/>
    <ellipse cx="-38" cy="10" rx="20" ry="28" fill="none"/>
    <circle cx="62" cy="-15" r="8" fill="${INK}" stroke="none"/>
    <ellipse cx="85" cy="40" rx="45" ry="16" fill="#F4A6B8" stroke="none" opacity=".9"/></g>`; },
  /** Garis bau putus-putus berliuk dari (x1,y1) ke (x2,y2). */
  smell(x1,y1,x2,y2,color='mint',amp=26){ const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L; let out='';
    for(const ph of [0,Math.PI]){let d='';for(let i=0;i<=40;i++){const t=i/40,w=Math.sin(t*Math.PI*3+ph)*amp;d+=(i?' L':'M')+(x1+dx*t+nx*w).toFixed(1)+' '+(y1+dy*t+ny*w).toFixed(1);}
      out+=`<path class="flow" d="${d}" fill="none" stroke="${col(color)}" stroke-width="6" stroke-dasharray="16 10" stroke-linecap="round"/>`;}
    return out; },
  bacterium(x,y,rot=0,s=1,fill='#A78BFA'){ return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><rect x="-55" y="-22" width="110" height="44" rx="22" fill="${fill}" stroke="${INK}" stroke-width="4"/><circle cx="25" cy="-5" r="5" fill="${INK}"/><circle cx="40" cy="-5" r="5" fill="${INK}"/><circle cx="33" cy="8" r="3.5" fill="${INK}"/></g>`; },
  colony(x,y,s=1,fill){ const P=[[-70,-30,25],[10,-55,-15],[60,0,40],[-25,25,-60],[-90,40,15],[40,55,70]]; return `<g transform="translate(${x} ${y}) scale(${s})">`+P.map((p,i)=>`<g class="wiggle" style="--d:-${i*.2}s">${C.bacterium(p[0],p[1],p[2],1,fill)}</g>`).join('')+'</g>'; },
  /** Molekul dua cincin heksagon + OH. */
  molecule(x,y,s=1,color='mint'){ const c=col(color),r=45; const hex=cx=>{let p='';for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;p+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1);}return p+'Z';};
    return `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${c}" stroke-width="7" stroke-linejoin="round"><path d="${hex(-39)}"/><path d="${hex(39)}"/><path d="M78 -22 L110 -45 M-78 -22 L-115 -40 M0 45 V85"/><text x="118" y="-55" fill="${c}" stroke="none" font-family="Poppins" font-weight="800" font-size="30">OH</text></g>`; },
  /** Label kecil berbentuk pil. */
  pill(x,y,text,color='mint',size=30){ const w=text.length*size*.56+48,h=size*1.7,c=col(color); return `<g transform="translate(${x} ${y})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${BG}" stroke="${c}" stroke-width="3.5"/><text y="2" font-family="Poppins,sans-serif" font-size="${size}" font-weight="700" fill="${c}" text-anchor="middle" dominant-baseline="middle">${esc(text)}</text></g>`; },
  /** Label besar berisi warna (mis. BANYAK / SEDIKIT). */
  chip(x,y,text,color='mint',size=56){ const w=text.length*size*.7+80,h=size*1.75; return `<g transform="translate(${x} ${y})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${col(color)}" stroke="${INK}" stroke-width="5"/><text y="3" font-family="Poppins,sans-serif" font-size="${size}" font-weight="900" fill="${INK}" text-anchor="middle" dominant-baseline="middle">${esc(text)}</text></g>`; },
  /** Kaca pembesar; inner digambar dengan koordinat absolut dan dipotong lingkaran. opt {bg} */
  magnifier(x,y,r,inner='',o={}){ const id='m'+(++_uid),k=r*.72; return `<clipPath id="${id}"><circle cx="${x}" cy="${y}" r="${r}"/></clipPath><line x1="${x+k}" y1="${y+k}" x2="${x+k+r*.6}" y2="${y+k+r*.6}" stroke="#8B7CF0" stroke-width="${r*.16}" stroke-linecap="round"/><g clip-path="url(#${id})"><circle cx="${x}" cy="${y}" r="${r}" fill="${o.bg||'#2A2660'}"/>${inner}</g><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#F8FAFC" stroke-width="10"/>`; },
  drop(x,y,s=1,color='blue'){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 -45 C16 -18 30 0 30 18 A30 30 0 0 1 -30 18 C-30 0 -16 -18 0 -45Z" fill="${col(color)}" stroke="${INK}" stroke-width="4"/><ellipse cx="-10" cy="15" rx="6" ry="10" fill="#fff" opacity=".6"/></g>`; },
  /** Tetes air setengah bola di atas tanah. */
  dome(x,w=300,y=G){ const h=w*.36; return `<path d="M${x-w/2} ${y} A${w/2} ${h} 0 0 1 ${x+w/2} ${y}Z" fill="#5B87B5" stroke="#F8FAFC" stroke-width="6"/><circle cx="${x-w*.22}" cy="${y-h*.55}" r="${w*.06}" fill="#fff" opacity=".45"/>`; },
  /** Butiran/partikel yang menyembur. opt {n, spread, dist, colors, angle(derajat, -90 = atas)} */
  particles(x,y,o={}){ const n=o.n||24,sp=o.spread||160,dist=o.dist||420,cs=o.colors||['#F8FAFC','#6EE7B7','#A5F3FC'],ang=(o.angle??-90)*Math.PI/180; let s='';
    for(let i=0;i<n;i++){const a=ang+(rnd()-.5)*sp*Math.PI/180/1.2,d=dist*(.5+rnd()*.6);s+=`<g class="drift" style="--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d).toFixed(0)}px;--dur:${(1.6+rnd()).toFixed(2)}s;--d:-${(rnd()*2.5).toFixed(2)}s"><circle cx="${x}" cy="${y}" r="${(4+rnd()*7).toFixed(1)}" fill="${cs[i%cs.length]}"/></g>`;}
    return s; },
  /** Panel berbingkai dengan label di atas (untuk perbandingan kiri-kanan). (x,y) = tengah. */
  panel(x,y,w,h,label,color='mint',inner=''){ const c=col(color),id='p'+(++_uid); return `<clipPath id="${id}"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="28"/></clipPath><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="28" fill="#28245E"/><g clip-path="url(#${id})">${inner}<rect x="${x-w/2}" y="${y+h/2-70}" width="${w}" height="70" fill="#5A3A20"/></g><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="28" fill="none" stroke="${c}" stroke-width="6"/>${label?C.pill(x,y-h/2+55,label,color):''}`; },
  /** Kertas jurnal/penelitian. */
  paper(x,y,title,sub='',rot=-4){ let l='';for(let i=0;i<5;i++)l+=`<rect x="-150" y="${-20+i*42}" width="${i%2?230:300}" height="14" rx="7" fill="#CBD5E1"/>`;
    return `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="-190" y="-200" width="380" height="440" rx="18" fill="#F8FAFC" stroke="${INK}" stroke-width="5"/><text y="-140" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="36" fill="${INK}">${esc(title)}</text><text y="-95" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="30" fill="#6D5BD0">${esc(sub)}</text>${l}</g>`; },
  /** Kartu (undangan, catatan, kutipan). opt {title, subtitle, lines[]} */
  card(x,y,w,h,o={}){ const L=(o.lines||[]).map((t,i)=>`<text x="${-w/2+70}" y="${-h/2+235+i*58}" font-family="Poppins" font-weight="500" font-size="38" fill="${INK}">${esc(t)}</text>`).join('');
    return `<g transform="translate(${x} ${y}) rotate(-2)"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="26" fill="#FFF7E0" stroke="${INK}" stroke-width="6"/><rect x="${-w/2+22}" y="${-h/2+22}" width="${w-44}" height="${h-44}" rx="16" fill="none" stroke="#E5A93B" stroke-width="4" stroke-dasharray="18 12"/><text y="${-h/2+110}" text-anchor="middle" font-family="Poppins" font-weight="900" font-size="72" fill="${INK}">${esc(o.title||'')}</text><text y="${-h/2+165}" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="40" fill="#C2701E">${esc(o.subtitle||'')}</text>${L}</g>`; },
  qmark(x,y,s=1,color='yellow'){ return `<g data-sfx="boing" transform="translate(${x} ${y}) scale(${s})"><g class="bob"><text text-anchor="middle" dominant-baseline="middle" font-family="Poppins" font-weight="900" font-size="200" fill="${col(color)}" stroke="${INK}" stroke-width="5">?</text></g></g>`; },
  check(x,y,s=1){ return `<g data-sfx="ding" transform="translate(${x} ${y}) scale(${s})"><circle r="60" fill="#6EE7B7" stroke="${INK}" stroke-width="5"/><path d="M-28 2 L-6 24 L30 -22" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>`; },
  cross(x,y,s=1){ return `<g data-sfx="buzz" transform="translate(${x} ${y}) scale(${s})"><circle r="60" fill="#F87171" stroke="${INK}" stroke-width="5"/><path d="M-24 -24 L24 24 M24 -24 L-24 24" stroke="${INK}" stroke-width="12" stroke-linecap="round"/></g>`; },
  sparkle(x,y,s=1){ let o='';[[0,0,1],[60,-50,.7],[-50,60,.6],[70,60,.5]].forEach((p,i)=>{o+=`<g transform="translate(${p[0]} ${p[1]}) scale(${p[2]})"><g class="pulse" style="--d:-${i*.3}s"><path d="M0 -30 L8 -8 L30 0 L8 8 L0 30 L-8 8 L-30 0 L-8 -8Z" fill="#FDE68A"/></g></g>`;}); return `<g data-sfx="sparkle" transform="translate(${x} ${y}) scale(${s})">${o}</g>`; },
  /** Panah putus-putus. */
  arrow(x1,y1,x2,y2,color='white'){ const c=col(color),a=Math.atan2(y2-y1,x2-x1),h=26; return `<g stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"><path class="flow" d="M${x1} ${y1} L${x2} ${y2}" stroke-dasharray="18 12"/><path d="M${x2-h*Math.cos(a-.5)} ${y2-h*Math.sin(a-.5)} L${x2} ${y2} L${x2-h*Math.cos(a+.5)} ${y2-h*Math.sin(a+.5)}"/></g>`; },
  /** Ikon sederhana: 'cup' | 'book' | 'glass' | 'bulb' | 'phone' | 'leaf' */
  icon(name,x,y,s=1){ const S=`stroke="${INK}" stroke-width="5" stroke-linejoin="round"`; const I={
    cup:`<path d="M-55 -50 H55 V40 A25 25 0 0 1 30 65 H-30 A25 25 0 0 1 -55 40Z" fill="#D9892B" ${S}/><path d="M55 -25 A30 30 0 0 1 55 30" fill="none" stroke="#D9892B" stroke-width="12"/><g class="bob" stroke="#CBD5E1" stroke-width="5" fill="none"><path d="M-25 -70 c-15 -20 15 -30 0 -55 M0 -70 c-15 -20 15 -30 0 -55 M25 -70 c-15 -20 15 -30 0 -55"/></g>`,
    book:`<path d="M0 -50 C-30 -65 -70 -65 -95 -55 V60 C-70 50 -30 50 0 65 C30 50 70 50 95 60 V-55 C70 -65 30 -65 0 -50Z" fill="#F1F5F9" ${S}/><path d="M0 -50 V65" stroke="#F87171" stroke-width="6"/><g stroke="#94A3B8" stroke-width="4">${[-25,-5,15,35].map(v=>`<path d="M-80 ${v} H-15 M15 ${v} H80"/>`).join('')}</g>`,
    glass:`<path d="M-50 -80 H50 L40 80 H-40Z" fill="#D9892B" ${S}/><rect x="-50" y="-80" width="100" height="20" fill="#FFF7E0"/>${C.particles(0,-60,{n:10,spread:40,dist:120,colors:['#fff']})}`,
    bulb:`<circle cy="-20" r="60" fill="#FDE68A" ${S}/><rect x="-28" y="40" width="56" height="40" rx="8" fill="#94A3B8" ${S}/>`,
    phone:`<rect x="-55" y="-100" width="110" height="200" rx="18" fill="#334155" ${S}/><rect x="-42" y="-80" width="84" height="150" rx="6" fill="#7DD3FC"/>`,
    leaf:`<path d="M0 60 C-70 20 -60 -60 0 -80 C60 -60 70 20 0 60Z" fill="#9BC26B" ${S}/><path d="M0 60 V-60" stroke="${INK}" stroke-width="4"/>`};
    return `<g transform="translate(${x} ${y}) scale(${s})">${I[name]||''}</g>`; },
  /** Orang tampak depan (kepala + bahu). mood: 'calm'|'happy'|'yawn'|'sleepy'|'alert'|'shock'|'sad'|'hold'|'look'. opt {shirt, hair} */
  person(x,y,s=1,mood='calm',o={}){ const shirt=col(o.shirt||'blue'),hair=o.hair||'#2B2238',S=`stroke="${INK}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`; let eyes,mouth='';
    if(['yawn','sleepy','hold','happy'].includes(mood)) eyes=mood==='happy'?`<path d="M-62 -4 Q-42 -24 -22 -4 M22 -4 Q42 -24 62 -4" fill="none" ${S}/>`:`<path d="M-62 -12 Q-42 4 -22 -12 M22 -12 Q42 4 62 -12" fill="none" ${S}/>`;
    else if(mood==='alert'||mood==='shock') eyes=`<circle cx="-40" cy="-12" r="20" fill="#fff" ${S}/><circle cx="40" cy="-12" r="20" fill="#fff" ${S}/><circle cx="-40" cy="-10" r="9" fill="${INK}"/><circle cx="40" cy="-10" r="9" fill="${INK}"/>`;
    else { const dx=mood==='look'?-8:0; eyes=`<circle cx="${-40+dx}" cy="-10" r="10" fill="${INK}"/><circle cx="${40+dx}" cy="-10" r="10" fill="${INK}"/>`; }
    if(mood==='yawn') mouth=`<g class="pulse"><ellipse cx="0" cy="58" rx="32" ry="44" fill="#4A1D3A" ${S}/><ellipse cx="0" cy="82" rx="18" ry="12" fill="#F87171"/></g>`;
    else if(mood==='shock') mouth=`<ellipse cx="0" cy="58" rx="20" ry="26" fill="#4A1D3A" ${S}/>`;
    else if(mood==='sleepy') mouth=`<ellipse cx="0" cy="52" rx="14" ry="10" fill="#4A1D3A" ${S}/>`;
    else if(mood==='sad') mouth=`<path d="M-24 62 Q0 42 24 62" fill="none" ${S}/>`;
    else if(mood==='hold') mouth=`<path d="M-26 55 Q-13 45 0 55 Q13 65 26 55" fill="none" ${S}/><path d="M95 -60 C105 -40 112 -28 102 -20 A12 12 0 0 1 86 -32 C86 -42 92 -50 95 -60Z" fill="#7DD3FC" stroke="${INK}" stroke-width="3"/>`;
    else if(mood==='happy') mouth=`<path d="M-30 44 Q0 84 30 44Z" fill="#4A1D3A" ${S}/>`;
    else mouth=`<path d="M-22 50 Q0 66 22 50" fill="none" ${S}/>`;
    return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-150 270 C-150 180 -95 150 0 150 C95 150 150 180 150 270Z" fill="${shirt}" ${S}/><rect x="-28" y="100" width="56" height="60" fill="#F2B98B" ${S}/>
    <circle cx="-112" cy="10" r="24" fill="#F2B98B" ${S}/><circle cx="112" cy="10" r="24" fill="#F2B98B" ${S}/><circle r="115" fill="#F2B98B" ${S}/>
    <path d="M-117 -5 C-125 -95 -60 -135 0 -135 C70 -135 125 -95 117 -5 C95 -60 40 -75 -10 -70 C-55 -66 -95 -45 -117 -5Z" fill="${hair}" ${S}/>
    <ellipse cx="-70" cy="32" rx="16" ry="10" fill="#F4A6B8"/><ellipse cx="70" cy="32" rx="16" ry="10" fill="#F4A6B8"/>${eyes}${mouth}</g>`; },
  /** Otak pink. */
  brain(x,y,s=1,fill='#F9A8D4'){ const B=[[-70,-15,68],[-10,-50,72],[60,-35,66],[85,25,52],[-50,40,56],[20,40,60]];
    return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-14" y="60" width="28" height="60" rx="12" fill="#E879A8" stroke="${INK}" stroke-width="5"/>${B.map(b=>`<circle cx="${b[0]}" cy="${b[1]}" r="${b[2]}" fill="${fill}" stroke="${INK}" stroke-width="10"/>`).join('')}${B.map(b=>`<circle cx="${b[0]}" cy="${b[1]}" r="${b[2]}" fill="${fill}"/>`).join('')}
    <path d="M0 -110 C-15 -60 15 -20 0 30 C-10 60 0 80 0 90 M-110 0 C-80 -10 -60 10 -40 -5 M40 -70 C55 -40 85 -45 100 -60 M30 20 C60 5 90 20 120 10 M-70 60 C-50 45 -30 70 -10 60" fill="none" stroke="#DB5F9A" stroke-width="7" stroke-linecap="round"/></g>`; },
  /** Mata besar. */
  eye(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-90 0 Q0 -80 90 0 Q0 80 -90 0Z" fill="#F8FAFC" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><circle r="36" fill="#7DD3FC" stroke="${INK}" stroke-width="5"/><circle r="16" fill="${INK}"/><circle cx="-10" cy="-12" r="7" fill="#fff"/></g>`; },
  /** Anjing tampak depan. mood 'calm'|'yawn' */
  dog(x,y,s=1,mood='calm'){ const S=`stroke="${INK}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`, yw=mood==='yawn';
    return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="210" rx="130" ry="90" fill="#D9A066" ${S}/><ellipse cx="-105" cy="-20" rx="40" ry="85" transform="rotate(20 -105 -20)" fill="#8B5A2B" ${S}/><ellipse cx="105" cy="-20" rx="40" ry="85" transform="rotate(-20 105 -20)" fill="#8B5A2B" ${S}/>
    <ellipse cx="0" cy="10" rx="110" ry="115" fill="#D9A066" ${S}/><ellipse cx="0" cy="60" rx="60" ry="${yw?62:45}" fill="#F8FAFC" ${S}/>
    ${yw?`<path d="M-45 -20 Q-30 -32 -15 -20 M15 -20 Q30 -32 45 -20" fill="none" ${S}/><g class="pulse"><ellipse cx="0" cy="80" rx="30" ry="34" fill="#4A1D3A" ${S}/><ellipse cx="0" cy="100" rx="16" ry="11" fill="#F87171"/></g>`:`<circle cx="-35" cy="-20" r="11" fill="${INK}"/><circle cx="35" cy="-20" r="11" fill="${INK}"/><path d="M-20 75 Q0 90 20 75" fill="none" ${S}/>`}
    <ellipse cx="0" cy="${yw?30:40}" rx="24" ry="16" fill="${INK}"/></g>`; },
  /** Termometer; level 0..1, isi naik dengan animasi grow. */
  thermo(x,y,s=1,level=.85,color='red'){ const c=col(color); return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-26" y="-200" width="52" height="230" rx="26" fill="#F8FAFC" stroke="${INK}" stroke-width="5"/><circle cy="50" r="48" fill="${c}" stroke="${INK}" stroke-width="5"/>${A('grow',.5,`<rect x="-12" y="${30-210*level}" width="24" height="${210*level}" rx="12" fill="${c}"/>`)}</g>`; },
  /** Zzz mengambang (ngantuk/tidur). */
  zzz(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><g class="bob">${C.text(0,0,'z',{size:60,color:'#C4B5FD',weight:900})}${C.text(45,-55,'z',{size:76,color:'#C4B5FD',weight:900})}${C.text(100,-125,'Z',{size:96,color:'#C4B5FD',weight:900})}</g></g>`; },
  /** Kepingan salju (dingin). */
  flake(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><g class="spin" stroke="#BAE6FD" stroke-width="8" stroke-linecap="round">${[0,60,120].map(r=>`<path transform="rotate(${r})" d="M0 -40 V40 M-12 -28 L0 -40 L12 -28 M-12 28 L0 40 L12 28"/>`).join('')}</g></g>`; },
  /** Gelembung chat/ucapan; lebar menyesuaikan teks. tail 'left'|'right' */
  bubble(x,y,txt,color='white',tail='left',size=36){ const c=col(color),w=Math.max(160,txt.length*size*.6+70),t=tail==='right'?1:-1;
    return `<g transform="translate(${x} ${y})"><path d="M${t*w*.2} 30 L${t*w*.3} 64 L${t*w*.38} 30Z" fill="${c}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><rect x="${-w/2}" y="-38" width="${w}" height="76" rx="30" fill="${c}" stroke="${INK}" stroke-width="4"/><path d="M${t*w*.2+4} 34 L${t*w*.38-4} 34" stroke="${c}" stroke-width="10"/><text y="4" text-anchor="middle" dominant-baseline="middle" font-family="Poppins" font-weight="800" font-size="${size}" fill="${INK}">${esc(txt)}</text></g>`; },
  /** Satu batang grafik (tumbuh dari bawah) + label di bawah garis dasar `base`. */
  bar(x,base,h,color,label,d=.3,w=130){ return A('grow',d,`<rect x="${x-w/2}" y="${base-h}" width="${w}" height="${h}" rx="18" fill="${col(color)}" stroke="${INK}" stroke-width="5"/>`)+(label?A('fade',d+.3,C.pill(x,base+50,label,'white',26)):''); },
  /** Ponsel besar; inner digambar dengan koordinat lokal (0,0 = tengah layar, layar ±150 x ±260). */
  phone(x,y,s=1,inner=''){ const id='ph'+(++_uid); return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-175" y="-310" width="350" height="620" rx="44" fill="#334155" stroke="${INK}" stroke-width="6"/><clipPath id="${id}"><rect x="-150" y="-265" width="300" height="530" rx="16"/></clipPath><rect x="-150" y="-265" width="300" height="530" rx="16" fill="#7DD3FC"/><g clip-path="url(#${id})">${inner}</g><rect x="-40" y="-292" width="80" height="12" rx="6" fill="${INK}"/></g>`; },
};

/* ---------- ikon sosial media untuk outro (viewBox 0 0 100 100) ---------- */
const TT_NOTE='M52 14 H66 C67 25 74 32 85 33 V47 C77 47 71 45 66 41 V64 A22 22 0 1 1 44 42 V57 A8 8 0 1 0 52 64Z';
const SOCIAL_ICONS = {
  tiktok: `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#000"/><path d="${TT_NOTE}" fill="#25F4EE" transform="translate(-3 -3)"/><path d="${TT_NOTE}" fill="#FE2C55" transform="translate(3 3)"/><path d="${TT_NOTE}" fill="#fff"/></svg>`,
  instagram: `<svg viewBox="0 0 100 100"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".35" stop-color="#FA7E1E"/><stop offset=".6" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(#igg)"/><rect x="22" y="22" width="56" height="56" rx="17" fill="none" stroke="#fff" stroke-width="7"/><circle cx="50" cy="50" r="13" fill="none" stroke="#fff" stroke-width="7"/><circle cx="66" cy="34" r="4.5" fill="#fff"/></svg>`,
};

/* ---------- timeline ---------- */
let acc = 0;
// window.__DURS (diisi render.js saat voiceover) menimpa durasi agar pas dengan panjang suara
const TL = SCENES.map((s,i)=>{ const d=(window.__DURS&&window.__DURS[i])||s.dur||3; const o={s,i,start:acc,end:acc+d}; acc=o.end; return o; });
/** Teks voiceover scene: field vo, atau gabungan small + big. */
const voText = s => s.type==='outro' ? (s.vo||'') : (s.vo ?? [s.small,s.big].filter(Boolean).join(' ').toLowerCase());
const TOTAL = acc;
const stage = document.getElementById('stage');
const live = new Map();

function buildScene(o){
  const s=o.s, el=document.createElement('div'); el.className='scene'; _seed=97+o.i*13; _uid=o.i*1000;
  if(s.type==='outro'){
    el.classList.add('outro');
    const b=s.brand||CONFIG.brand, k=CONFIG.brandSplit??b.length, id='lg'+o.i;
    const word=`<text x="540" y="900" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="900" font-size="${Math.min(200,1500/b.length)}" letter-spacing="-4">`;
    let wave='M-240 0'; for(let x=-240;x<1320;x+=120) wave+=` Q${x+60} -26 ${x+120} 0`; wave+=' V400 H-240Z';
    const mask=(m,a,c)=>`<mask id="${m}" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">${word}<tspan fill="${a}">${esc(b.slice(0,k))}</tspan><tspan fill="${c}">${esc(b.slice(k))}</tspan></text></mask>`;
    const liquid=(m,c1,c2)=>`<g mask="url(#${m})"><g class="fillup" style="--d:.9s"><g transform="translate(0 860)"><g class="wave"><path d="${wave}" fill="${c1}"/></g></g>
        <g transform="translate(0 874)"><g class="wave" style="animation-duration:1.7s"><path d="${wave}" fill="${c2}" opacity=".6" transform="translate(-60 0)"/></g></g></g></g>`;
    el.innerHTML=`<svg viewBox="0 0 1080 1920"><defs>${mask(id+'a','#fff','#000')}${mask(id+'b','#000','#fff')}</defs>
      ${liquid(id+'a','#F8FAFC','#CBD5E1')}${liquid(id+'b','#FBBF24','#F59E0B')}
      ${word.replace('<text','<text class="draw" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linejoin="round"')}<tspan>${esc(b.slice(0,k))}</tspan><tspan stroke="#FBBF24">${esc(b.slice(k))}</tspan></text></svg>
      ${(s.tagline??CONFIG.tagline)?`<div class="tag rise" style="--d:1.8s">${esc(s.tagline??CONFIG.tagline)}</div>`:''}
      <div class="socials" style="${(s.tagline??CONFIG.tagline)?'top:1260px':''}">${(s.socials||CONFIG.socials||[]).map((a,i)=>`<div class="soc rise" style="--d:${2+i*.25}s">${SOCIAL_ICONS[a.icon]||''}<span>${esc(a.handle)}</span></div>`).join('')}</div>`;
  } else {
    const prev=SCENES[o.i-1]; const same=prev&&prev.type!=='outro'&&prev.small===s.small;
    const gt = s.ground===undefined ? CONFIG.ground : s.ground;
    let art=''; try{ art = s.art ? s.art(C) : ''; }catch(e){ console.error('Scene '+(o.i+1)+' error:',e); }
    const ground = gt ? C.ground(gt) : '';
    el.innerHTML = `<svg class="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">${s.rain?C.rain(s.rain):''}${ground}${art}</svg>
      <div class="badge">${esc(CONFIG.brand)}</div><div class="wm">${esc(CONFIG.handle)}</div>
      <div class="cap">${s.small?`<div class="small ${same?'':'rise'}">${esc(s.small)}</div>`:''}${s.big?`<div class="big pop" style="--d:${s.small&&!same?.3:.05}s;color:${col(s.color)}">${esc(s.big)}</div>`:''}</div>
      ${s.cta?`<div class="ctaw"><div class="cta rise" style="--d:${s.ctaDelay??1.2}s">${esc(s.cta)}</div></div>`:''}`;
  }
  stage.appendChild(el);
  const big=el.querySelector('.big');
  if(big){ let fs=s.bigSize||128; big.style.fontSize=fs+'px'; while(big.scrollWidth>1000&&fs>64){fs-=4;big.style.fontSize=fs+'px';} if(big.scrollWidth>1000){big.style.whiteSpace='normal';} }
  el.anims = el.getAnimations({subtree:true}); el.anims.forEach(a=>a.pause());
  return el;
}
function seekEl(el,t){ for(const a of el.anims) a.currentTime=Math.max(0,t)*1000; }
function render(t){
  t=Math.max(0,Math.min(t,TOTAL-0.001));
  const idx=TL.findIndex(o=>t<o.end), cur=TL[idx], local=t-cur.start, fading=idx>0&&local<XF;
  const need=new Set([idx]); if(fading) need.add(idx-1);
  for(const [k,el] of live) if(!need.has(k)){ el.remove(); live.delete(k); }
  for(const k of need) if(!live.has(k)) live.set(k, buildScene(TL[k]));
  const el=live.get(idx); el.style.zIndex=2; el.style.opacity=fading?local/XF:1; seekEl(el,local);
  if(fading){ const p=live.get(idx-1); p.style.zIndex=1; p.style.opacity=1; seekEl(p,t-TL[idx-1].start); }
  document.getElementById('bar').style.width=(t/TOTAL*100)+'%';
}

/* ---------- pemutar ---------- */
const Q=new URLSearchParams(location.search);
function fit(){ const s=Q.has('render')?1:Math.min(innerWidth/1080,innerHeight/1920); stage.style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit();
if(Q.has('render')) document.body.classList.add('render');
let playing=false,t0=0,pos=0;
function loop(now){ if(!playing) return; pos=(now-t0)/1000; if(pos>=TOTAL){pos=TOTAL-0.001;playing=false;document.getElementById('play').style.display='';} render(pos); requestAnimationFrame(loop); }
function play(){ if(pos>=TOTAL-0.01) pos=0; playing=true; t0=performance.now()-pos*1000; document.getElementById('play').style.display='none'; requestAnimationFrame(loop); }
function pause(){ playing=false; document.getElementById('play').style.display=''; }
document.getElementById('play').onclick=play;
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();playing?pause():play();} if(e.code==='ArrowRight'){pos=Math.min(TOTAL-.01,pos+2);render(pos);} if(e.code==='ArrowLeft'){pos=Math.max(0,pos-2);render(pos);} });
stage.addEventListener('click',()=>playing?pause():play());

/* ---------- sound effect otomatis (dibaca render.js) ---------- */
const SFX_BY_CLASS = { pop:'pop2', grow:'pop2', slideL:'swish', slideR:'swish' };
function sceneSfx(o){
  const s=o.s; if(s.sfx===false) return [];
  let ev=[];
  if(s.type==='outro'){
    const n=(s.socials||CONFIG.socials||[]).length;
    ev.push({at:0,s:'whoosh'},{at:.9,s:'rise'},{at:2,s:'sparkle'}); for(let i=0;i<n;i++) ev.push({at:2+i*.25,s:'pop2'});
  } else {
    const prev=SCENES[o.i-1];
    if(o.i>0 && !(prev&&prev.small===s.small)) ev.push({at:0,s:'whoosh'});
    const el=buildScene(o);
    el.querySelectorAll('.pop,.grow,.slideL,.slideR,.cta').forEach(n=>{
      const at=parseFloat(n.style.getPropertyValue('--d'))||0;
      const tag=n.closest('[data-sfx]')||n.querySelector('[data-sfx]');
      const cls=Object.keys(SFX_BY_CLASS).find(c=>n.classList.contains(c));
      ev.push({at, s: tag?tag.dataset.sfx : n.classList.contains('big')?'pop' : n.classList.contains('cta')?'pop2' : SFX_BY_CLASS[cls]});
    });
    el.remove();
  }
  if(Array.isArray(s.sfx)) ev=ev.concat(s.sfx);
  ev.sort((a,b)=>a.at-b.at);
  // buang yang terlalu rapat (< 0.1 dtk), maksimal 6 per scene agar tidak ramai
  const outEv=[]; for(const e of ev){ if(e.at>=(o.end-o.start)) continue; const last=outEv.filter(x=>x.s!=='whoosh').pop(); if(e.s!=='whoosh'&&last&&e.at-last.at<.1) continue; outEv.push(e); }
  return outEv.slice(0,6);
}

window.__TOTAL=TOTAL;
window.__sfxEvents=()=>{ const all=TL.flatMap(o=>sceneSfx(o).map(e=>({t:+(o.start+e.at).toFixed(3),s:e.s,v:e.v}))); render(pos); return all; };
window.__SCENES=TL.map(o=>({start:o.start,end:o.end,dur:o.end-o.start,big:o.s.big||o.s.type,vo:voText(o.s)}));
window.__seek=t=>render(t);
window.__ready=document.fonts.ready.then(()=>{ pos=Q.has('t')?+Q.get('t'):(Q.has('render')?0:1.2); render(pos); if(Q.has('autoplay')) play(); return TOTAL; });
</script>
</body>
