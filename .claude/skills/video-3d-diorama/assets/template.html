<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video 3D Diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="three.min.js"></script>
<style>
:root{--bg:#1E1B4B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0a1a;overflow:hidden;font-family:'Plus Jakarta Sans',Poppins,system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;transform-origin:center;background:#bcd3e6}
#gl{position:absolute;inset:0;width:1080px;height:1920px}
#cap{position:absolute;left:60px;right:60px;top:1150px;text-align:center;color:#fff;font-weight:800;font-size:76px;line-height:1.15;letter-spacing:-.5px;
  text-shadow:0 4px 14px rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.6);white-space:pre-wrap}
#cap span{display:inline-block}
#logo{position:absolute;left:36px;top:70px;width:230px;padding:10px 22px;border-radius:999px;z-index:5;
  background:linear-gradient(135deg,rgba(31,27,74,.62),rgba(31,27,74,.38));border:1.5px solid rgba(255,255,255,.35);
  box-shadow:0 12px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4);backdrop-filter:blur(14px) saturate(150%)}
#logo svg{display:block;width:100%;height:auto}
#wm{position:absolute;right:40px;bottom:46px;color:rgba(255,255,255,.9);font-weight:700;font-size:30px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#outro{position:absolute;inset:0;background:var(--bg);visibility:hidden}
#outro svg.logo{position:absolute;inset:0;width:1080px;height:1920px}
#outro .tag{position:absolute;left:0;right:0;top:1080px;text-align:center;color:#F8FAFC;font-weight:500;font-size:50px;font-family:Poppins,sans-serif}
#outro .socials{position:absolute;left:0;right:0;top:1170px;display:flex;flex-direction:column;align-items:center;gap:34px}
#outro .soc{display:flex;align-items:center;gap:28px;color:#F8FAFC;font-weight:700;font-size:56px;white-space:nowrap;font-family:Poppins,sans-serif}
#outro .soc svg{width:92px;height:92px;flex:none}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.draw{stroke-dasharray:1400;animation:draw 1.1s ease-in-out both}
.fillup{animation:fillup 1.3s cubic-bezier(.45,0,.2,1) both;animation-delay:var(--d,1s)}
.wave{animation:wave 1.2s linear infinite}
@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes fillup{from{transform:translateY(160px)}to{transform:translateY(-220px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-240px)}}
#play{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;font:800 28px Poppins,sans-serif;padding:22px 48px;border-radius:999px;border:0;background:#FBBF24;color:#16132E;cursor:pointer}
#bar{position:fixed;left:0;bottom:0;height:5px;background:#FBBF24;z-index:20;width:0}
body.render #play,body.render #bar{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="mblur" x="0" y="0" width="100%" height="100%"><feGaussianBlur id="mblurStd" stdDeviation="0 0" edgeMode="duplicate"/></filter></svg>
<div id="wrap"><div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><div id="cap"></div><div id="logo"></div><div id="wm"></div><div id="outro"></div></div></div>
<button id="play">▶ PUTAR</button>
<div id="bar"></div>
<script>
/* =====================================================================
   BAGIAN YANG DIISI — CONFIG, WORLD (opsional) dan SHOTS. Engine di bawah jangan diubah.
   Satuan meter. Sumbu: x kanan, y atas, z ke arah kamera. Permukaan tanah y = 0.
   ===================================================================== */
const CONFIG = {
  brand: "KepoTau",
  brandSplit: 4,               // logo outro: "Kepo" putih, "Tau" kuning
  tagline: "",
  handle: "@3d.kepotau.ofc",   // watermark kanan bawah + teks di spanduk/billboard (akun khusus video 3D)
  socials: [ { icon: "tiktok", handle: "@3d.kepotau.ofc" }, { icon: "instagram", handle: "@3d.kepotau.ofc" } ],
  ambience: true,              // suara angin + burung samar di bawah VO
};

/* WORLD: objek yang sudah ada sejak awal (lingkungan). Kembalikan array objek dari K.* */
const WORLD = K => [
  K.field({ cutZ: -5 }),                                    // padang rumput di belakang diorama
  K.forest({ count: 70, rMin: 18, rMax: 70, cutZ: -9 }),   // pepohonan latar
  // satu tanah menyambung: area A (sungai, x 2..7) dan area B (galian saringan, x 23.4..28.6) bersebelahan
  K.ground({ x: [-18, 44], z: [-5, 5], depth: 14, cuts: [ { x: [2, 7], depth: 1.6 }, { x: [23.4, 28.6], z: [-1.7, 5], depth: 3.3 } ] }),
  K.water([4.5, -1.6, 0], [5, 0.9, 10], { color: '#8a7a5c' }),
  K.fence([-12, 0, -4.6], [-1, 0, -4.6]), K.fence([8, 0, -4.6], [40, 0, -4.6]),
  // reklame KepoTau di sepanjang tepi belakang (billboard, bendera, bunting, standee, spanduk bergantian)
  K.ads({ x: [-18, 44], z: -3.9, every: 6.5, skip: [[-4.5, 1.5], [1.5, 7.5]] }),  // kosongkan belakang papan tahun & parit sungai
  K.flag([8.6, 0, 2.2], { rot: -25 }), K.flag([30.8, 0, 2.4], { rot: -15 }),
  // gerigi yang digerakkan poros kincir (detail mekanis: semua bagian bergerak)
  K.gears([6.4, -0.3, 1.2], { list: [ { r: .55, teeth: 12 }, { r: .35, teeth: 8 } ], speed: -0.6, angle: 90 }),
];

/* SHOTS: tiap shot = satu kalimat VO + caption kata per kata + kamera + transisi + objek yang muncul.
   Variasikan gerak kamera (jangan sama dua kali berturut-turut) dan pakai whip untuk pindah ke area sebelah. */
const SHOTS = [
  { say: "kamu tinggal di tahun 1582",
    cam: { focus: [0, 0.5, 0], dist: 21, angle: 25, pitch: 24, move: 'reveal' },
    add: K => [ A(K.sign([-3, 0, -2.6], '1582'), 'drop', .5, 'year') ] },
  { say: "airnya ada di sungai, tapi gimana cara naikinnya?", trans: 'fly',
    cam: { focus: [4.5, -1, 0], dist: 14, angle: -18, pitch: 17, move: 'orbitR' } },
  { say: "kamu pasang kincir air",
    cam: { focus: [4.5, -0.2, 0], dist: 13, angle: 32, pitch: 13, move: 'zoomIn', amount: .8 },
    add: K => [ A(K.waterWheel([4.5, -1.6, 0], { r: 1.5 }), 'rise', .2, 'wheel') ] },
  { say: "buat naikin airnya ke menara", trans: 'fly',
    cam: { focus: [-0.5, 2.2, 0], dist: 14, angle: 8, pitch: 6, move: 'craneUp' },
    add: K => [ A(K.tower([-1, 0, 0], { h: 4.2 }), 'rise', .1),
                A(K.pipe([[3.2, -0.7, 0.8], [0.2, -0.7, 0.8], [0.2, 4.7, 0.8]]), 'grow', .7) ] },
  { say: "terus salurin lewat pipa ke rumah",
    cam: { focus: [-4, 1.5, -0.5], dist: 16, angle: -28, pitch: 26, move: 'truckL' },
    add: K => [ A(K.house([-6.5, 0, -1], { w: 3.4, d: 3.6, h: 2.8 }), 'drop', .2), A(K.poster([-7.55, 1.7, 0.82], { w: 1.1, h: .55 }), 'pop', .8),
                A(K.pipe([[-1.8, 4.5, 0.8], [-4.2, 4.5, 0.8], [-4.2, 1.8, 0.8]]), 'grow', .9) ] },
  { say: "airnya nyampe, tapi warnanya kayak teh susu",
    cam: { focus: [80.2, 1.5, -0.6], dist: 7, angle: 25, pitch: 14, move: 'push' },
    add: K => [ K.room([80, 0, 0], { w: 5, d: 4, h: 3.2 }), K.brandBoard([79, 2.5, -1.93], 0, 1),
                K.tub([80.3, 0, -0.6]), K.tap([80.3, 1.45, -1.95]), K.bucket([82, 0, 1], '#F07D6A'),
                A(K.stream([80.3, 1.36, -1.5], 0.55), 'fade', .3), A(K.water([80.3, 0.12, -0.6], [1.92, 0.7, 1.32], { color: '#B79A72', opacity: 1 }), 'grow', .4) ] },
  { say: "jadi kamu bikin",
    cam: { focus: [6, 0, 0], dist: 20, angle: 0, pitch: 18, move: 'zoomOut' } },
  { say: "saringan pasir di sebelahnya", trans: 'whip',
    cam: { focus: [26, -1.4, 0], dist: 17, angle: 0, pitch: 12, move: 'push' },
    add: K => [ A(K.tank([26, -3.3, 0], { w: 5, d: 3.2, h: 3.3 }), 'rise', 0),
                A(K.sign([30, 0, -3], '1829'), 'drop', .2, 'year'),
                A(K.layers([26, -3.12, 0], [4.64, 2.84], [ { h: .5, color: '#8f8f8f' }, { h: .7, color: '#b89a6a' }, { h: 1.0, color: '#d9c08f' } ]), 'grow', .5) ] },
  { say: "pelan-pelan airnya lewat pasir, kotorannya ketahan di atas", trans: 'zoom',
    cam: { focus: [26, -1.8, 0], dist: 10, angle: -18, pitch: 6, move: ['zoomIn', 'orbitR'], amount: .6 },
    add: K => [ K.particles([26, -0.92, 0], [4.4, 0.9, 2.6], { n: 50, color: '#5b4024', size: .05, motion: 'settle' }),
                K.particles([26, -2.9, 0], [4.4, 2.0, 2.6], { n: 24, color: '#e8f4ff', size: .045, motion: 'down' }) ] },
  { type: "outro", dur: 3.5 },
];

/* =====================================================================
   ENGINE — tidak perlu diubah
   ===================================================================== */
const LEAD = 0.25;
const LOGO_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" ><g transform="translate(0 0) scale(1.00000)"><g fill="none" stroke-linecap="round" stroke-linejoin="round"> <path d="M46 296 C54 254 84 236 120 230" stroke="#E6EAF2" stroke-width="7"/> <path d="M128 212 L126 232 M168 214 L170 230" stroke="#E6EAF2" stroke-width="7"/> <path d="M150 56 C206 54 236 96 232 146 C228 194 196 222 148 222 C100 222 70 192 68 144 C66 100 94 62 144 57" stroke="#E6EAF2" stroke-width="7"/> <path d="M70 134 C54 128 48 150 58 162 C62 168 68 168 72 166" stroke="#E6EAF2" stroke-width="6"/> <path d="M100 74 C102 54 118 42 132 40 M130 60 C134 40 152 30 170 32 M164 60 C174 44 192 44 204 52" stroke="#E6EAF2" stroke-width="6"/> <path d="M80 106 C92 94 108 94 118 100 C126 88 142 84 156 90" stroke="#E6EAF2" stroke-width="5"/> <path d="M94 116 C102 108 114 106 124 110" stroke="#E6EAF2" stroke-width="5.5"/> <ellipse cx="110" cy="136" rx="10" ry="12" stroke="#E6EAF2" stroke-width="5"/> <circle cx="114" cy="133" r="4.5" fill="#E6EAF2" stroke="none"/> <path d="M138 142 C134 154 132 162 140 166 C144 168 148 166 150 164" stroke="#E6EAF2" stroke-width="5"/> <ellipse cx="128" cy="190" rx="8" ry="9.5" stroke="#E6EAF2" stroke-width="5"/> <path d="M84 166 l9 -4 M90 174 l9 -4" stroke="#F5B21B" stroke-width="3.5" opacity=".75"/> <ellipse cx="182" cy="134" rx="21" ry="24" stroke="#E6EAF2" stroke-width="5.5"/> <circle cx="188" cy="128" r="10" fill="#E6EAF2" stroke="none"/> <circle cx="192" cy="124" r="3.2" fill="#1F1B4A" stroke="none"/> <path d="M160 100 C172 92 190 92 202 98" stroke="#E6EAF2" stroke-width="5"/> <circle cx="182" cy="134" r="44" stroke="#F5B21B" stroke-width="9"/> <path d="M154 108 C160 100 168 96 176 95" stroke="#FFFFFF" stroke-width="4" opacity=".55"/> <path d="M214 166 L224 180" stroke="#F5B21B" stroke-width="15"/> <path d="M228 244 C236 262 244 280 248 298 M262 236 C272 254 280 276 284 298" stroke="#E6EAF2" stroke-width="7"/> <path d="M222 206 C222 194 236 188 248 194 L262 204 C272 212 272 230 262 238 C252 246 236 248 226 240 C216 232 216 216 222 206 Z" stroke="#E6EAF2" stroke-width="6.5"/> <path d="M232 202 C238 208 238 216 232 222 M244 206 C250 212 250 222 244 228 M256 214 C260 220 258 228 252 234" stroke="#E6EAF2" stroke-width="4.5"/> <path d="M222 214 C214 212 208 218 212 226 C214 230 220 230 224 228" stroke="#E6EAF2" stroke-width="5"/> <path d="M30 72 C30 54 52 48 60 60 C68 72 52 78 48 88 L48 96" stroke="#F5B21B" stroke-width="7"/> <circle cx="48" cy="112" r="4.5" fill="#F5B21B" stroke="none"/> </g> </g><g transform="translate(311.02 197.03) scale(0.16033)"><path fill="#E3E7EF" d="M473 0 252 -309V0H56V-705H252V-401L471 -705H697L438 -363L710 0ZM1290 -241H919Q922 -195 944.5 -172.5Q967 -150 1002 -150Q1051 -150 1072 -194H1281Q1268 -136 1230.5 -90.5Q1193 -45 1136.0 -19.0Q1079 7 1010 7Q927 7 862.5 -28.0Q798 -63 761.5 -128.0Q725 -193 725 -281Q725 -369 761.0 -433.5Q797 -498 861.5 -533.0Q926 -568 1010 -568Q1093 -568 1157.0 -534.0Q1221 -500 1257.0 -436.5Q1293 -373 1293 -287Q1293 -264 1290 -241ZM1093 -336Q1093 -372 1069.0 -392.5Q1045 -413 1009 -413Q973 -413 950.0 -393.5Q927 -374 920 -336ZM1708 -568Q1775 -568 1829.5 -533.0Q1884 -498 1915.5 -433.0Q1947 -368 1947 -281Q1947 -194 1915.5 -128.5Q1884 -63 1829.5 -28.0Q1775 7 1708 7Q1651 7 1609.5 -16.0Q1568 -39 1544 -78V268H1348V-561H1544V-483Q1567 -522 1609.0 -545.0Q1651 -568 1708 -568ZM1646 -397Q1603 -397 1573.5 -366.0Q1544 -335 1544 -281Q1544 -226 1573.5 -195.0Q1603 -164 1646 -164Q1689 -164 1718.5 -195.5Q1748 -227 1748 -281Q1748 -336 1718.5 -366.5Q1689 -397 1646 -397ZM1971 -281Q1971 -368 2009.5 -433.0Q2048 -498 2114.5 -533.0Q2181 -568 2265 -568Q2349 -568 2415.5 -533.0Q2482 -498 2520.5 -433.0Q2559 -368 2559 -281Q2559 -194 2520.5 -128.5Q2482 -63 2415.0 -28.0Q2348 7 2264 7Q2180 7 2113.5 -28.0Q2047 -63 2009.0 -128.0Q1971 -193 1971 -281ZM2360 -281Q2360 -338 2332.5 -368.0Q2305 -398 2265 -398Q2225 -398 2198.0 -368.0Q2171 -338 2171 -281Q2171 -223 2197.0 -193.0Q2223 -163 2264 -163Q2305 -163 2332.5 -193.5Q2360 -224 2360 -281Z"/><path fill="#F5B21B" d="M3145 -705V-549H2957V0H2761V-549H2575V-705ZM3400 -568Q3458 -568 3500.0 -545.0Q3542 -522 3565 -483V-561H3761V0H3565V-78Q3542 -39 3499.5 -16.0Q3457 7 3400 7Q3333 7 3278.5 -28.0Q3224 -63 3192.5 -128.5Q3161 -194 3161 -281Q3161 -368 3192.5 -433.0Q3224 -498 3278.5 -533.0Q3333 -568 3400 -568ZM3463 -397Q3419 -397 3390.0 -366.5Q3361 -336 3361 -281Q3361 -227 3390.0 -195.5Q3419 -164 3463 -164Q3506 -164 3535.5 -195.0Q3565 -226 3565 -281Q3565 -335 3535.5 -366.0Q3506 -397 3463 -397ZM4422 -561V0H4225V-80Q4200 -42 4156.0 -18.5Q4112 5 4055 5Q3957 5 3900.5 -59.5Q3844 -124 3844 -235V-561H4039V-260Q4039 -212 4064.5 -184.5Q4090 -157 4132 -157Q4175 -157 4200.0 -184.5Q4225 -212 4225 -260V-561Z"/></g></svg>';
let LOGO_IMG = null; // gambar logo resmi untuk tekstur spanduk/papan 3D
let _seed = 3;
const rnd = () => { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const E = { inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, out:t=>1-Math.pow(1-t,3),
  back:t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);},
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;} };

/** A(objek, animasi, delay, sfx?): objek muncul dengan animasi saat shot dimulai + delay.
 *  animasi: 'rise' (naik dari bawah) | 'drop' (jatuh memantul) | 'pop' (membesar) | 'grow' (tumbuh dari bawah/awal pipa) | 'fade' | 'none'
 *  opt: 'year' (bunyi ding), nama SFX, id untuk remove, atau {id, sfx}. Default SFX: rise/drop→clunk, pop→pop2, grow air→splash. */
const SFX_NAMES=['pop','pop2','whoosh','swish','ding','buzz','boing','rise','sparkle','clunk','splash'];
function A(obj, anim='pop', delay=0, opt){ const u=obj.userData; u.anim=anim; u.delay=delay;
  if(typeof opt==='string'){ if(opt==='year') u.sfx='ding'; else if(SFX_NAMES.includes(opt)) u.sfx=opt; else u.id=opt; }
  else if(opt){ if(opt.id) u.id=opt.id; if(opt.sfx) u.sfx=opt.sfx; }
  return obj; }

/* ---------- material & tekstur prosedural ---------- */
const TEX = {};
function canvasTex(w,h,draw,repeat){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);} return t; }
function speckle(g,w,h,n,cols,rmax){ for(let i=0;i<n;i++){ g.fillStyle=cols[i%cols.length]; g.globalAlpha=.25+rnd()*.5; g.beginPath(); g.ellipse(rnd()*w,rnd()*h,1+rnd()*rmax,1+rnd()*rmax*.6,rnd()*3,0,7); g.fill(); } g.globalAlpha=1; }
function grassTex(){ return TEX.grass ||= canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#6f9a3c'; g.fillRect(0,0,w,h);
  for(let i=0;i<8;i++){ g.fillStyle=i%2?'#76a242':'#69923a'; g.fillRect(0,i*h/8,w,h/8); } speckle(g,w,h,5000,['#5d8531','#86b04d','#4f7428'],2); },[6,6]); }
function soilSideTex(hm,grass=true,off=0){ // strata menurut kedalaman absolut: off = kedalaman sisi atas blok (m), jadi lapisan menyambung di bawah galian
  const H=Math.max(64,Math.round(hm*90)); return canvasTex(512,H,(g,w,h)=>{
    const L=[[0.12,grass?'#5f8a35':'#4a3a26'],[0.25,'#4a3a26'],[1.2,'#6b4a2e'],[2.4,'#7a3b24'],[99,'#4a2a1c']]; let top=0;
    for(const [m,c] of L){ const a=Math.max(top,off), b=Math.min(m,off+hm); if(b>a){ g.fillStyle=c; g.fillRect(0,(a-off)*90,w,(b-a)*90+1); } top=m; }
    speckle(g,w,h,w*h/90,['#2e1d12','#8a5f3c','#3a2618','#9a6a44'],3); }); }
function woodTex(){ return TEX.wood ||= canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#8a6a4a'; g.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){ g.strokeStyle=rnd()>.5?'#76583a':'#9c7c5a'; g.globalAlpha=.6; g.lineWidth=1+rnd()*2; g.beginPath(); const y=rnd()*h; g.moveTo(0,y); g.bezierCurveTo(w*.3,y+rnd()*8-4,w*.6,y+rnd()*8-4,w,y+rnd()*6-3); g.stroke(); } g.globalAlpha=1; },[1,1]); }
function tileTex(color,grout){ const k=color+grout; return TEX[k] ||= canvasTex(256,256,(g,w,h)=>{ g.fillStyle=grout; g.fillRect(0,0,w,h); g.fillStyle=color;
  for(let y=0;y<4;y++)for(let x=0;x<4;x++) g.fillRect(x*64+2,y*64+2,60,60); speckle(g,w,h,300,['#ffffff'],1.2); },[4,4]); }
function concreteTex(){ return TEX.conc ||= canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#8d8a84'; g.fillRect(0,0,w,h); speckle(g,w,h,3000,['#6f6c66','#a6a39c','#5d5a55'],2.5); },[2,2]); }
const M = {
  std:(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:o.rough??.85,metalness:o.metal??0,map:o.map||null,transparent:!!o.opacity&&o.opacity<1,opacity:o.opacity??1,side:o.side??THREE.FrontSide}),
  wood:()=>M.std('#ffffff',{map:woodTex(),rough:.9}),
  metal:(c='#9aa3ab')=>M.std(c,{rough:.35,metal:.7}),
};
function mesh(geo,mat,pos=[0,0,0],cast=true){ const m=new THREE.Mesh(geo,mat); m.position.set(...pos); m.castShadow=cast; m.receiveShadow=true; return m; }
function grp(pos=[0,0,0],...kids){ const g=new THREE.Group(); g.position.set(...pos); kids.flat().forEach(k=>k&&g.add(k)); return g; }
function box(w,h,d,mat,pos=[0,0,0]){ return mesh(new THREE.BoxGeometry(w,h,d),mat,pos); }
function cyl(rt,rb,h,mat,pos=[0,0,0],seg=20){ return mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,pos); }
function textTex(text,o={}){ return canvasTex(o.w||512,o.h||256,(g,w,h)=>{ g.fillStyle=o.bg||'#f4f4f2'; g.fillRect(0,0,w,h);
  if(o.border){ g.strokeStyle=o.border; g.lineWidth=14; g.strokeRect(7,7,w-14,h-14); }
  g.fillStyle=o.color||'#3a3a3a'; g.textAlign='center'; g.textBaseline='middle'; let fs=o.size||120; const ff=o.font||"'Plus Jakarta Sans',sans-serif";
  do { g.font=`${o.weight||600} ${fs}px ${ff}`; fs-=4; } while(g.measureText(text).width>w-48 && fs>20); g.fillText(text,w/2,(o.sub?h*.42:h/2));
  if(o.sub){ g.font=`600 ${o.subSize||46}px Poppins,sans-serif`; g.fillStyle=o.subColor||o.color; g.fillText(o.sub,w/2,h*.75); } }); }

/** Tekstur logo resmi KepoTau di atas latar warna (untuk spanduk/papan/bendera) + handle di bawahnya. */
function logoTex(w,h,bg='#1F1B4A'){ return canvasTex(w,h,(g,W,H)=>{ g.fillStyle=bg; g.fillRect(0,0,W,H);
  const lw=W*.78, lh=lw*300/1040, ly=(H-lh)/2-H*.06; if(LOGO_IMG) g.drawImage(LOGO_IMG,(W-lw)/2,ly,lw,lh);
  g.fillStyle='rgba(227,231,239,.85)'; g.font=`600 ${Math.round(W*.045)}px Poppins,sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(CONFIG.handle,W/2,Math.min(H-W*.05,ly+lh+W*.06));
  g.strokeStyle='#F5B21B'; g.lineWidth=W*.012; g.strokeRect(W*.02,H*.04,W*.96,H*.92); }); }

/* ---------- prefab K.* (origin = tengah bawah objek) ---------- */
const K = {
  /** Padang rumput datar di belakang garis potong cutZ (z < cutZ). */
  field({cutZ=5,size=200}={}){ const m=mesh(new THREE.PlaneGeometry(size,size),M.std('#ffffff',{map:grassTex()}),[0,-0.002,cutZ-size/2],false); m.rotation.x=-Math.PI/2; m.material.map=grassTex().clone(); m.material.map.repeat.set(size/6,size/6); m.material.map.needsUpdate=true; return m; },
  /** Tanah diorama potongan dengan galian. x:[x0,x1], z:[z0,z1] (depan = z1, terlihat penampangnya), depth = tebal tanah.
   *  cuts: [{x:[a,b], depth, z:[c,d]?}] — parit/lubang sedalam depth. Tanpa z = parit memanjang sepanjang z (mis. sungai);
   *  dengan z = lubang/galian (jika d = z1, galian terbuka ke depan sehingga isinya terlihat). */
  ground({x:[x0,x1],z:[z0,z1],depth=6,cuts=[]}){ const g=grp(), add=(xa,xb,za,zb,top,bot,grass=true)=>{ if(xb-xa<1e-3||zb-za<1e-3||top-bot<1e-3) return; g.add(K.soil([(xa+xb)/2,top,(za+zb)/2],[xb-xa,top-bot,zb-za],{grass})); };
    const xs=[...new Set([x0,x1,...cuts.flatMap(c=>c.x)])].sort((a,b)=>a-b);
    for(let i=0;i<xs.length-1;i++){ const a=xs[i], b=xs[i+1], c=cuts.find(c=>c.x[0]<=a&&c.x[1]>=b);
      if(!c){ add(a,b,z0,z1,0,-depth); continue; }
      add(a,b,z0,z1,-c.depth,-depth,false);
      if(c.z){ add(a,b,z0,c.z[0],0,-c.depth); add(a,b,c.z[1],z1,0,-c.depth); } }
    return g; },
  /** Blok tanah potongan (cutaway): atas rumput, sisi berlapis tanah. pos = tengah atas blok. */
  soil(pos,[w,h,d],{grass=true}={}){ const side=M.std('#ffffff',{map:soilSideTex(h,grass,Math.max(0,-pos[1]))}), top=grass?M.std('#ffffff',{map:grassTex()}):M.std('#5a3d26');
    const m=mesh(new THREE.BoxGeometry(w,h,d),[side,side,top,side,side,side],[pos[0],pos[1]-h/2,pos[2]]); return grp([0,0,0],m); },
  /** Air: kotak transparan. pos = tengah bawah. opt {color, opacity} */
  water(pos,[w,h,d],{color='#5aa3c8',opacity=.88}={}){ const g=grp(pos, mesh(new THREE.BoxGeometry(w,h,d),M.std(color,{rough:.12,metal:.1,opacity}),[0,h/2,0],false)); g.userData.water=true; return g; },
  tree(pos,s=1){ const g=grp(pos), tm=M.std('#5a4330'), lm=M.std(['#4f6b2f','#5d7a36','#46622a'][Math.floor(rnd()*3)],{rough:1});
    g.add(cyl(.12*s,.2*s,2.2*s,tm,[0,1.1*s,0],8)); for(let i=0;i<5;i++){ const r=(.9+rnd()*.7)*s; const f=mesh(new THREE.IcosahedronGeometry(r,1),lm,[(rnd()-.5)*1.6*s,(2.4+rnd()*1.3)*s,(rnd()-.5)*1.6*s]); f.material.flatShading=true; g.add(f);} return g; },
  forest({count=40,rMin=22,rMax=45,cutZ=-6}={}){ const g=grp(); let n=0,guard=0; while(n<count&&guard++<2000){ const a=rnd()*Math.PI*2, r=rMin+rnd()*(rMax-rMin), x=Math.cos(a)*r, z=Math.sin(a)*r; if(z>cutZ) continue; g.add(K.tree([x,0,z],1+rnd()*.8)); n++; } return g; },
  fence(a,b,{h=1.1}={}){ const g=grp(), m=M.wood(), dx=b[0]-a[0], dz=b[2]-a[2], L=Math.hypot(dx,dz), n=Math.max(2,Math.round(L/2)+1), ang=Math.atan2(dz,dx);
    for(let i=0;i<n;i++){ const t=i/(n-1); g.add(box(.12,h,.12,m,[a[0]+dx*t,a[1]+h/2,a[2]+dz*t])); }
    for(const y of [h*.45,h*.85]){ const r=box(L,.08,.06,m,[(a[0]+b[0])/2,a[1]+y,(a[2]+b[2])/2]); r.rotation.y=-ang; g.add(r); } return g; },
  /** Papan dengan tulisan (tahun/era) di atas dua tiang. */
  sign(pos,text,{w=1.6,h=0.8,rot=0}={}){ const g=grp(pos), m=M.wood(); g.rotation.y=rot;
    g.add(box(.08,1.5,.08,m,[-w*.35,.75,0]),box(.08,1.5,.08,m,[w*.35,.75,0]));
    const face=M.std('#ffffff',{map:textTex(text,{w:Math.round(256*w/h),h:256,size:150,weight:500,color:'#4a4a4a'}),rough:.8}); g.add(mesh(new THREE.BoxGeometry(w,h,.06),[M.std('#e8e8e4'),M.std('#e8e8e4'),M.std('#e8e8e4'),M.std('#e8e8e4'),face,M.std('#e8e8e4')],[0,1.5+h/2-.1,.05])); return g; },
  /** Papan branding KepoTau (biru) untuk ditempel di dinding/tangki. rot = rotasi Y. */
  brandBoard(pos,rot=0,s=1){ const tex=logoTex(1024,440,'#1F1B4A');
    const g=grp(pos, mesh(new THREE.BoxGeometry(1.2*s,.52*s,.04),[M.std('#14112f'),M.std('#14112f'),M.std('#14112f'),M.std('#14112f'),M.std('#ffffff',{map:tex,rough:.6}),M.std('#14112f')],[0,0,0],false)); g.rotation.y=rot; return g; },
  /** Spanduk kain berlogo KepoTau di antara dua tiang, berkibar pelan. pos = tengah bawah, rot = derajat. */
  banner(pos,{w=3,h=1.3,pole=2.6,rot=0,color='#1F1B4A'}={}){ const g=grp(pos), m=M.wood(), sx=24, sy=10;
    g.add(cyl(.06,.07,pole,m,[-w/2-.05,pole/2,0],8), cyl(.06,.07,pole,m,[w/2+.05,pole/2,0],8));
    const geo=new THREE.PlaneGeometry(w,h,sx,sy), cloth=mesh(geo,new THREE.MeshStandardMaterial({map:logoTex(1024,Math.round(1024*h/w),color),side:THREE.DoubleSide,roughness:.9}),[0,pole-h/2-.08,0]);
    const base=geo.attributes.position.array.slice(); g.add(cloth); g.rotation.y=rot*Math.PI/180;
    g.userData.update=t=>{ const a=geo.attributes.position.array; for(let k=0;k<a.length;k+=3){ const x=base[k], y=base[k+1], edge=1-Math.abs(x)/(w/2); a[k+2]=Math.sin(x*2.2+t*3.1)*.07*edge+Math.sin(y*3+t*2.3)*.03*edge; } geo.attributes.position.needsUpdate=true; geo.computeVertexNormals(); };
    return g; },
  /** Bendera berlogo di tiang tinggi, berkibar. pos = kaki tiang, rot = derajat. */
  flag(pos,{h=4.5,fw=1.8,fh=1.0,rot=0,color='#1F1B4A'}={}){ const g=grp(pos), sx=20, sy=8;
    g.add(cyl(.05,.06,h,M.metal('#c9cfd5'),[0,h/2,0],10), mesh(new THREE.SphereGeometry(.09,12,8),M.metal('#d4a72c'),[0,h+.05,0]));
    const geo=new THREE.PlaneGeometry(fw,fh,sx,sy); geo.translate(fw/2,0,0);
    const cloth=mesh(geo,new THREE.MeshStandardMaterial({map:logoTex(1024,Math.round(1024*fh/fw),color),side:THREE.DoubleSide,roughness:.9}),[.04,h-fh/2-.1,0]);
    const base=geo.attributes.position.array.slice(); g.add(cloth); g.rotation.y=rot*Math.PI/180;
    g.userData.update=t=>{ const a=geo.attributes.position.array; for(let k=0;k<a.length;k+=3){ const x=base[k], y=base[k+1], f=x/fw; a[k+2]=Math.sin(x*3-t*5)*.16*f; a[k+1]=y-f*f*.08+Math.sin(x*2-t*4)*.03*f; } geo.attributes.position.needsUpdate=true; geo.computeVertexNormals(); };
    return g; },
  /** Kincir air kayu, berputar terus. pos = titik bawah poros-ish (pusat roda di y + r*0.8). */
  waterWheel(pos,{r=1.6,width=1.1,speed=.6}={}){ const g=grp(pos), m=M.wood(), wheel=new THREE.Group(), cy=r*.8;
    for(const z of [-width/2,width/2]){ const rim=mesh(new THREE.TorusGeometry(r,.07,8,40),m,[0,0,z]); wheel.add(rim);
      for(let i=0;i<8;i++){ const s=box(r*2,.08,.08,m); s.rotation.z=i*Math.PI/8; s.position.z=z; wheel.add(s);} }
    for(let i=0;i<16;i++){ const a=i*Math.PI/8, p=box(.5,.06,width,m,[Math.cos(a)*(r-.15),Math.sin(a)*(r-.15),0]); p.rotation.z=a; wheel.add(p); }
    wheel.add(cyl(.12,.12,width+1.2,m,[0,0,0],12).rotateX(Math.PI/2)); wheel.position.y=cy; g.add(wheel);
    for(const z of [-width/2-.6,width/2+.6]) g.add(box(.18,cy+.4,.18,m,[0,(cy+.4)/2,z]));
    g.userData.update=t=>{ wheel.rotation.z=-t*speed; }; return g; },
  /** Menara kayu dengan tangki logam di atas (+ papan brand kecil). */
  tower(pos,{h=4,w=1.4,tank=true}={}){ const g=grp(pos), m=M.wood();
    for(const x of [-w/2,w/2]) for(const z of [-w/2,w/2]) g.add(box(.14,h,.14,m,[x,h/2,z]));
    for(let y=.8;y<h;y+=1.2){ g.add(box(w,.1,.1,m,[0,y,w/2]),box(w,.1,.1,m,[0,y,-w/2]),box(.1,.1,w,m,[w/2,y,0]),box(.1,.1,w,m,[-w/2,y,0])); }
    if(tank){ g.add(box(w+.5,.9,w+.5,M.std('#b9c2cb',{rough:.45,metal:.35}),[0,h+.45,0])); g.add(K.brandBoard([0,h+.45,(w+.5)/2+.03],0,.55)); } return g; },
  /** Pipa mengikuti titik-titik [[x,y,z],...] (sudut tajam). Animasi 'grow' memanjangkan pipa dari titik awal. */
  pipe(points,{r=.09,color='#5d6670',opacity=1}={}){ const g=grp(), mat=opacity<1?M.std(color,{rough:.3,opacity}):M.metal(color), segs=[];
    for(let i=0;i<points.length-1;i++){ const a=new THREE.Vector3(...points[i]), b=new THREE.Vector3(...points[i+1]), L=a.distanceTo(b);
      const m=cyl(r,r,1,mat,[0,0,0],12); m.geometry.translate(0,.5,0); m.position.copy(a); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize()); m.userData.L=L; m.scale.y=L; g.add(m); segs.push(m);
      g.add(mesh(new THREE.SphereGeometry(r*1.25,12,8),mat,points[i+1])); }
    g.userData.grow=p=>{ const tot=segs.reduce((s,m)=>s+m.userData.L,0); let left=p*tot; segs.forEach(m=>{ const l=clamp(left,0,m.userData.L); m.scale.y=Math.max(1e-3,l); m.visible=l>0; left-=m.userData.L; }); g.children.forEach(c=>{ if(!segs.includes(c)) c.visible=p>.98; }); };
    return g; },
  /** Pompa piston (silinder naik-turun). */
  pump(pos,{h=1.6}={}){ const g=grp(pos), rod=cyl(.05,.05,h,M.metal('#c0c6cc'),[0,h,0],8); g.add(cyl(.18,.18,h,M.metal('#5d6670'),[0,h/2,0]),rod); g.userData.update=t=>{ rod.position.y=h+Math.sin(t*3)*.25; }; return g; },
  /** Rumah sederhana: dinding + atap pelana genteng + pintu. */
  house(pos,{w=3,d=3,h=2.6,wall='#2f2f33',roof='#b8573a'}={}){ const g=grp(pos);
    g.add(box(w,h,d,M.std(wall,{rough:.9}),[0,h/2,0]));
    const sh=new THREE.Shape(); sh.moveTo(-w/2-.2,0); sh.lineTo(0,h*.55); sh.lineTo(w/2+.2,0); sh.lineTo(-w/2-.2,0);
    const roofM=mesh(new THREE.ExtrudeGeometry(sh,{depth:d+.4,bevelEnabled:false}),M.std(roof,{rough:.8}),[0,h,-d/2-.2]); g.add(roofM);
    g.add(box(.8,1.6,.05,M.std('#6e4f34'),[0,.8,d/2+.02])); return g; },
  /** Ruangan dalam (lantai + 2 dinding belakang/kiri berkeramik), terbuka ke arah kamera (+z) dan kanan. */
  room(pos,{w=5,d=4,h=3,floor='#eef1f4',wall='#bcd3e6'}={}){ const g=grp(pos), ft=tileTex(floor,'#d4d9de'), wt=tileTex(wall,'#a9c0d4');
    g.add(box(w,.1,d,M.std('#ffffff',{map:ft,rough:.5}),[0,-.05,0])); g.add(box(w,h,.1,M.std('#ffffff',{map:wt,rough:.4}),[0,h/2,-d/2])); g.add(box(.1,h,d,M.std('#ffffff',{map:wt,rough:.4}),[-w/2,h/2,0])); return g; },
  /** Bak mandi keramik (kotak berongga). */
  tub(pos,{w=2.2,d=1.6,h=1.1,color='#cfe0ee'}={}){ const g=grp(pos), m=M.std('#ffffff',{map:tileTex(color,'#b6cadb'),rough:.4}), t=.14;
    g.add(box(w,.12,d,m,[0,.06,0]),box(w,h,t,m,[0,h/2,d/2-t/2]),box(w,h,t,m,[0,h/2,-d/2+t/2]),box(t,h,d,m,[w/2-t/2,h/2,0]),box(t,h,d,m,[-w/2+t/2,h/2,0])); return g; },
  tap(pos,{len=.5}={}){ const m=M.metal('#c9cfd5'); return grp(pos, cyl(.04,.04,len,m,[0,0,len/2],10).rotateX(Math.PI/2), cyl(.04,.04,.18,m,[0,-.09,len],10), box(.06,.14,.04,m,[0,.1,len*.7])); },
  /** Aliran air jatuh dari pos sepanjang len (bergelombang). */
  stream(pos,len=.6,{color='#a58a62',r=.06}={}){ const s=cyl(r,r*.8,len,M.std(color,{rough:.2,opacity:.85}),[0,-len/2,0],10); const g=grp(pos,s); g.userData.update=t=>{ s.scale.x=s.scale.z=1+Math.sin(t*20)*.12; }; return g; },
  bucket(pos,color='#F07D6A'){ return grp(pos, cyl(.32,.26,.55,M.std(color,{rough:.6}),[0,.275,0],24)); },
  /** Bak beton cutaway (dinding depan dibuka). pos = tengah bawah. */
  tank(pos,{w=4,d=3,h=3,t=.18}={}){ const g=grp(pos), m=M.std('#ffffff',{map:concreteTex()});
    g.add(box(w,t,d,m,[0,t/2,0]),box(w,h,t,m,[0,h/2,-d/2+t/2]),box(t,h,d,m,[w/2-t/2,h/2,0]),box(t,h,d,m,[-w/2+t/2,h/2,0])); return g; },
  /** Lapisan bertumpuk (pasir/kerikil/tanah). layers dari bawah ke atas: [{h,color}] */
  layers(pos,[w,d],layers){ const g=grp(pos); let y=0; layers.forEach(L=>{ const tex=canvasTex(256,128,(c,W,H)=>{ c.fillStyle=L.color; c.fillRect(0,0,W,H); speckle(c,W,H,900,['#00000055','#ffffff44'],2); });
    g.add(box(w,L.h,d,M.std('#ffffff',{map:tex}),[0,y+L.h/2,0])); y+=L.h; }); return g; },
  /** Partikel bergerak di dalam kotak (tengah-bawah pos, ukuran [w,h,d]). motion 'down' | 'up' | 'settle' (turun lalu diam di atas) | 'float' */
  particles(pos,[w,h,d],{n=30,color='#ffffff',size=.06,motion='down',speed=.5}={}){ const g=grp(pos), mat=M.std(color,{rough:.5}), ps=[];
    for(let i=0;i<n;i++){ const m=mesh(new THREE.SphereGeometry(size*(.7+rnd()*.6),8,6),mat,[(rnd()-.5)*w,rnd()*h,(rnd()-.5)*d],false); m.userData.p=[m.position.x,m.position.y,m.position.z,rnd()]; g.add(m); ps.push(m); }
    g.userData.update=(t,lt)=>{ ps.forEach(m=>{ const [x,y,z,ph]=m.userData.p; let yy;
      if(motion==='down') yy=h-((h-y)+lt*speed+ph*h)%h;
      else if(motion==='up') yy=(y+lt*speed+ph*h)%h;
      else if(motion==='settle') yy=y+(h*.9+ph*h*.1-y)*E.out(clamp(lt*speed/1.5));
      else yy=y+Math.sin(lt*2+ph*6)*.1;
      m.position.y=yy; }); }; return g; },
  /** Label melayang (selalu menghadap kamera), gaya pil putih. */
  label(pos,text,{color='#16132E',bg='#ffffff',s=1}={}){ const w=Math.max(256,text.length*34+80); const tex=canvasTex(w,110,(g,W,H)=>{ g.fillStyle=bg; const r=50; g.beginPath(); g.roundRect(4,4,W-8,H-8,r); g.fill(); g.fillStyle=color; g.font="700 54px 'Plus Jakarta Sans',sans-serif"; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,W/2,H/2+2); });
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false})); sp.scale.set(w/110*.45*s,.45*s,1); sp.renderOrder=10; const g=grp(pos,sp); g.userData.isLabel=true; return g; },
  /** Sumbat tanah untuk lubang yang BELUM digali. Taruh di posisi galian (cut) dan pakai A(K.plug(...), 'dig', delay) untuk animasi menggali (tanah berkurang dari atas).
   *  x:[a,b], z:[c,d], depth = sama dengan cut-nya. Atur lama galian lewat obj.userData.digDur (default 2.5 dtk). */
  plug({x:[a,b],z:[c,d],depth}){ const g=grp([(a+b)/2,-depth,(c+d)/2]); g.add(K.soil([0,depth,0],[b-a,depth,d-c])); return g; },
  /** Lapisan air tanah (akuifer) biru di penampang depan. x:[a,b], top = kedalaman atas (negatif), h, z = muka depan tanah. */
  aquifer({x:[a,b],top,h=.8,z=5,color='#4f7fa3'}){ const tex=canvasTex(512,128,(g,W,H)=>{ g.fillStyle=color; g.fillRect(0,0,W,H); speckle(g,W,H,700,['#9cc8e8','#2e5677'],2); });
    return grp([(a+b)/2,top-h,z+.01], mesh(new THREE.BoxGeometry(b-a,h,.04),M.std('#ffffff',{map:tex,rough:.5}),[0,h/2,0],false)); },
  /** Orang sederhana (figur tanah liat tanpa wajah). pose 'stand'|'walk'|'work'. rot = arah hadap (derajat). */
  person(pos,{color='#e07a3f',skin='#e0b48f',pants='#3a4a6a',pose='stand',rot=0,s=1}={}){ const g=grp(pos), body=new THREE.Group(), sk=M.std(skin), cl=M.std(color), pa=M.std(pants);
    const legL=cyl(.09,.08,.8,pa,[-.11,.4,0],10), legR=cyl(.09,.08,.8,pa,[.11,.4,0],10), armL=cyl(.06,.055,.62,cl,[-.32,1.22,0],8), armR=cyl(.06,.055,.62,cl,[.32,1.22,0],8);
    [armL,armR].forEach(m=>m.geometry.translate(0,-.28,0)); armL.position.y=armR.position.y=1.5;
    body.add(legL,legR,cyl(.22,.2,.72,cl,[0,1.16,0],14),armL,armR,mesh(new THREE.SphereGeometry(.17,16,12),sk,[0,1.72,0]),mesh(new THREE.SphereGeometry(.18,16,8,0,Math.PI*2,0,Math.PI/2),M.std('#2b2238'),[0,1.76,0]));
    body.scale.setScalar(s); g.add(body); g.rotation.y=rot*Math.PI/180;
    g.userData.update=(t,lt)=>{ const w=pose==='walk'?Math.sin(lt*7)*.5:pose==='work'?Math.sin(lt*5)*.9-.6:Math.sin(lt*1.5)*.04;
      armL.rotation.x=w; armR.rotation.x=pose==='work'?w:-w; legL.rotation.x=pose==='walk'?-w*.8:0; legR.rotation.x=pose==='walk'?w*.8:0; body.position.y=pose==='walk'?Math.abs(Math.sin(lt*7))*.04:0; };
    return g; },
  /** Pompa tangan (dragon) dengan tuas bergerak. */
  handPump(pos){ const g=grp(pos), m=M.metal('#3f6b4f'), lever=grp([0,1.05,0]);
    g.add(cyl(.16,.2,.12,m,[0,.06,0]), cyl(.11,.11,1,m,[0,.6,0]), cyl(.13,.13,.14,m,[0,1.1,0]));

  scene.add(new THREE.HemisphereLight('#dbeaff','#5b4a33',1.3));
  const sun=new THREE.DirectionalLight('#fff3e0',2.6); sun.position.set(18,30,14); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-30,right:50,top:30,bottom:-30,near:1,far:120}); sun.shadow.bias=-.0004; sun.shadow.normalBias=.03; scene.add(sun); scene.add(sun.target); sun.target.position.set(10,0,0);
  _seed=3;
  WORLD(K).forEach(o=>{ o.userData.from=-1; scene.add(o); OBJS.push(o); });
  TL.forEach(t=>{ if(!t.s.add) return; _seed=100+t.i*17; t.s.add(K).forEach(o=>{ o.userData.from=t.start+(TRANS[transOf(t.s)]||0)+(o.userData.delay||0); if(o.userData.isLabel&&!o.userData.keep) o.userData.until=t.end; scene.add(o); OBJS.push(o); }); });
  TL.forEach(t=>{ (t.s.remove||[]).forEach(id=>OBJS.filter(o=>o.userData.id===id).forEach(o=>o.userData.until=t.start)); });
  OBJS.forEach(o=>{ o.userData.base={p:o.position.clone(),s:o.scale.clone()}; if(o.userData.anim==='fade') o.traverse(c=>{ if(c.material){ c.material=c.material.clone(); c.material.transparent=true; c.userData.op=c.material.opacity; } }); });
  document.getElementById('wm').textContent=CONFIG.handle;
  buildOutro();
}
function applyObj(o,t){
  const u=o.userData, b=u.base; if(u.from<0){ o.visible=!(u.until!=null&&t>=u.until); if(o.visible) runUpdates(o,t,t); return; }
  const lt=t-u.from, gone=u.until!=null&&t>=u.until;
  o.visible = lt>=0 && !gone; if(!o.visible) return;
  const p=clamp(lt/.7);
  o.position.copy(b.p); o.scale.copy(b.s);
  switch(u.anim){
    case 'rise': o.position.y=b.p.y-(1-E.out(p))*3; break;
    case 'drop': o.position.y=b.p.y+(1-E.bounce(p))*5; break;
    case 'pop': o.scale.multiplyScalar(Math.max(1e-3,E.back(p))); break;
    case 'grow': if(u.grow) u.grow(E.inOut(clamp(lt/1.1))); else o.scale.y=Math.max(1e-3,b.s.y*E.out(p)); break;
    case 'fade': o.traverse(c=>{ if(c.material&&c.userData.op!=null) c.material.opacity=c.userData.op*p; }); break;
    case 'dig': o.scale.y=Math.max(1e-3,b.s.y*(1-E.inOut(clamp(lt/(u.digDur||2.5))))); break;
  }
  runUpdates(o,t,lt);
}
/** Jalankan animasi semua bagian (termasuk prefab yang dibungkus di dalam grup lain). */
function runUpdates(o,t,lt){ o.traverse(c=>{ if(c.userData.update) c.userData.update(t,lt); }); }
/* ---------- kamera ----------
   cam bentuk preset: { focus:[x,y,z], dist, angle (derajat, 0 = dari depan/+z, positif = dari kanan), pitch (derajat ke bawah),
                        move: 'static'|'zoomIn'|'zoomOut'|'push'|'pull'|'orbitL'|'orbitR'|'craneUp'|'craneDown'|'truckL'|'truckR'|'reveal'|'dive'
                              (boleh array untuk kombinasi), amount (0..2, default 1), fov, shake (0..1) }
   cam bentuk bebas (lama): { pos, look, to:{pos,look}, fov } */
const TRANS = { cut:0, whip:.5, fly:.9, zoom:.45 };   // durasi transisi masuk (detik)
const transOf = s => s.trans || 'cut';
function camState(s, p, t){
  const c=s.cam||{focus:[0,0,0]};
  if(c.pos){ const to=c.to||{}, q=E.inOut(p); return { pos:new THREE.Vector3(...c.pos).lerp(new THREE.Vector3(...(to.pos||c.pos)),q), look:new THREE.Vector3(...c.look).lerp(new THREE.Vector3(...(to.look||c.look)),q), fov:(c.fov||38)+((to.fov??c.fov??38)-(c.fov||38))*q }; }
  const F=new THREE.Vector3(...(c.focus||[0,0,0])), k=c.amount??1, q=E.inOut(p), mv=[].concat(c.move||'push');
  let d=c.dist||14, a=c.angle??20, e=c.pitch??22, fov=c.fov||38, look=F.clone(), side=0, up=0;
  for(const m of mv){ switch(m){
    case 'zoomIn':   fov*=1-.32*k*q; break;
    case 'zoomOut':  fov*=1-.32*k*(1-q); break;
    case 'push':     d*=1-.32*k*q; break;
    case 'pull':     d*=1-.32*k*(1-q); break;
    case 'orbitL':   a-=28*k*q; break;
    case 'orbitR':   a+=28*k*q; break;
    case 'craneUp':  e+=18*k*q-6*k; up+=1.2*k*q; break;
    case 'craneDown':e+=18*k*(1-q)-6*k; up+=1.2*k*(1-q); break;
    case 'truckL':   side-=d*.22*k*q; break;
    case 'truckR':   side+=d*.22*k*q; break;
    case 'reveal':   d*=1-.5*k*(1-q); e-=10*k*(1-q); break;   // dekat & rendah → lebar & tinggi
    case 'dive':     d*=1-.45*k*q; e+=14*k*(1-q); break;       // tinggi & lebar → dekat & rendah
  } }
  const ar=a*Math.PI/180, er=e*Math.PI/180;
  look.y-=(.5-(c.frameY??.42))*2*d*Math.tan(fov*Math.PI/360); // subjek di ~42% dari atas layar, di atas caption
  const pos=new THREE.Vector3(Math.sin(ar)*Math.cos(er), Math.sin(er), Math.cos(ar)*Math.cos(er)).multiplyScalar(d).add(F);
  const right=new THREE.Vector3(Math.cos(ar),0,-Math.sin(ar)); pos.addScaledVector(right,side); look.addScaledVector(right,side); look.y+=up;
  if(c.shake){ const sk=c.shake*.06; pos.x+=Math.sin(t*7.3)*sk+Math.sin(t*13.1)*sk*.5; pos.y+=Math.sin(t*9.7)*sk; }
  return { pos, look, fov };
}
function camAt(t){
  const sh=TL.find(o=>t<o.end)||TL[TL.length-1], s=sh.s; if(s.type==='outro') return;
  const lt=t-sh.start, dur=sh.end-sh.start; let st=camState(s, clamp(lt/dur), t), blur=0;
  const tr=transOf(s), T=TRANS[tr]||0, prev=TL[sh.i-1];
  if(T && prev && prev.s.type!=='outro' && lt<T){
    const A=camState(prev.s, 1, prev.end), x=lt/T;
    const w = tr==='whip' ? (x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2) : E.inOut(x);   // whip: sangat cepat di tengah
    st={ pos:A.pos.clone().lerp(st.pos,w), look:A.look.clone().lerp(st.look,w), fov:A.fov+(st.fov-A.fov)*w };
    if(tr==='whip') blur=60*Math.pow(Math.sin(Math.PI*x),2);
    if(tr==='zoom') st.fov*=1-.25*Math.sin(Math.PI*x);
  }
  camera.position.copy(st.pos); camera.fov=st.fov; camera.updateProjectionMatrix(); camera.lookAt(st.look);
  const gl=document.getElementById('gl'); document.getElementById('mblurStd').setAttribute('stdDeviation',`${blur.toFixed(1)} 0`); gl.style.filter=blur>.5?'url(#mblur)':'none';
}
/* caption kata per kata, dibagi potongan ≤3 kata / ≤18 huruf */
function chunks(say){ const W=(say||'').split(/\s+/).filter(Boolean), out=[]; let cur=[];
  W.forEach(w=>{ if(cur.length && (cur.length>=3 || (cur.join(' ')+' '+w).length>18)){ out.push(cur); cur=[]; } cur.push(w); }); if(cur.length) out.push(cur); return out; }
let capKey='';
function captionAt(t){
  const sh=TL.find(o=>t<o.end)||TL[TL.length-1], s=sh.s, el=document.getElementById('cap');
  if(s.type==='outro'||!s.say){ if(capKey){ el.innerHTML=''; capKey=''; } return; }
  const vod=(window.__VOD&&window.__VOD[sh.i])||(sh.end-sh.start-LEAD-.35), a=sh.start+LEAD, W=s.say.split(/\s+/).filter(Boolean);
  const wt=W.map(w=>w.length+2), tot=wt.reduce((x,y)=>x+y,0); let c=0; const starts=wt.map(w=>{ const v=a+vod*c/tot; c+=w; return v; });
  let wi=-1; starts.forEach((st,i)=>{ if(t>=st) wi=i; }); if(wi<0){ if(capKey){ el.innerHTML=''; capKey=''; } return; }
  const CH=chunks(s.say); let k=0, ci=0; for(;ci<CH.length;ci++){ if(wi<k+CH[ci].length) break; k+=CH[ci].length; }
  const shown=CH[ci].slice(0,wi-k+1), key=sh.i+':'+ci+':'+shown.length;
  if(key!==capKey){ capKey=key; el.innerHTML=shown.map(w=>`<span>${esc(w)}</span>`).join(' '); }
  const p=E.out(clamp((t-starts[wi])/.16)), last=el.lastElementChild; // kata terbaru "pop" kecil, dihitung dari waktu (deterministik)
  if(last){ last.style.opacity=p; last.style.transform=`translateY(${(1-p)*12}px) scale(${.9+.1*p})`; }
}
/* outro (HTML, sama seperti video-flat-edukasi) */
let outroAnims=[];
function buildOutro(){
  const el=document.getElementById('outro'), b=CONFIG.brand, k=CONFIG.brandSplit??b.length, id='lg';
  const word=`<text x="540" y="900" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="900" font-size="${Math.min(200,1500/b.length)}" letter-spacing="-4">`;
  let wave='M-240 0'; for(let x=-240;x<1320;x+=120) wave+=` Q${x+60} -26 ${x+120} 0`; wave+=' V400 H-240Z';
  const mask=(m,a,c)=>`<mask id="${m}" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">${word}<tspan fill="${a}">${esc(b.slice(0,k))}</tspan><tspan fill="${c}">${esc(b.slice(k))}</tspan></text></mask>`;
  const liquid=(m,c1,c2)=>`<g mask="url(#${m})"><g class="fillup" style="--d:.9s"><g transform="translate(0 860)"><g class="wave"><path d="${wave}" fill="${c1}"/></g></g><g transform="translate(0 874)"><g class="wave" style="animation-duration:1.7s"><path d="${wave}" fill="${c2}" opacity=".6" transform="translate(-60 0)"/></g></g></g></g>`;
  el.innerHTML=`<svg class="logo" viewBox="0 0 1080 1920"><defs>${mask(id+'a','#fff','#000')}${mask(id+'b','#000','#fff')}</defs>${liquid(id+'a','#F8FAFC','#CBD5E1')}${liquid(id+'b','#FBBF24','#F59E0B')}
    ${word.replace('<text','<text class="draw" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linejoin="round"')}<tspan>${esc(b.slice(0,k))}</tspan><tspan stroke="#FBBF24">${esc(b.slice(k))}</tspan></text></svg>
    ${CONFIG.tagline?`<div class="tag rise" style="--d:1.8s">${esc(CONFIG.tagline)}</div>`:''}
    <div class="socials" style="${CONFIG.tagline?'top:1260px':''}">${(CONFIG.socials||[]).map((a,i)=>`<div class="soc rise" style="--d:${2+i*.25}s">${SOCIAL_ICONS[a.icon]||''}<span>${esc(a.handle)}</span></div>`).join('')}</div>`;
  outroAnims=el.getAnimations({subtree:true}); outroAnims.forEach(a=>a.pause());
}
function render(t){
  t=clamp(t,0,TOTAL-.001);
  const sh=TL.find(o=>t<o.end)||TL[TL.length-1], out=document.getElementById('outro');
  document.getElementById('logo').style.opacity=sh.s.type==='outro'?Math.max(0,1-(t-sh.start)/.3):1;
  if(sh.s.type==='outro'){ out.style.visibility='visible'; out.style.opacity=clamp((t-sh.start)/.35); outroAnims.forEach(a=>a.currentTime=(t-sh.start)*1000); }
  else out.style.visibility='hidden';
  if(sh.s.type!=='outro' || t-sh.start<.35){ const tt=sh.s.type==='outro'?sh.start-.001:t; camAt(tt); OBJS.forEach(o=>applyObj(o,tt)); renderer.render(scene,camera); }
  captionAt(t);
  document.getElementById('bar').style.width=(t/TOTAL*100)+'%';
}

/* ---------- sound effect otomatis (dibaca render.js) ---------- */
window.__sfxEvents=()=>{ const ev=[];
  TL.forEach((o,i)=>{ if(o.s.sfx===false) return; if(i>0){ const tr=transOf(o.s); ev.push(tr==='whip'?{t:o.start+.05,s:'whoosh',v:1.2}:tr==='fly'?{t:o.start,s:'whoosh',v:.7}:tr==='zoom'?{t:o.start,s:'swish',v:.9}:{t:o.start,s:'whoosh',v:.4}); }
    if(o.s.type==='outro'){ ev.push({t:o.start+.9,s:'rise'},{t:o.start+2,s:'sparkle'}); (CONFIG.socials||[]).forEach((_,k)=>ev.push({t:o.start+2+k*.25,s:'pop2'})); }
    (o.s.sfx||[]).forEach(e=>ev.push({t:o.start+e.at,s:e.s,v:e.v})); });
  OBJS.forEach(ob=>{ const u=ob.userData; if(u.from<0||!u.anim||u.anim==='none') return; const s=u.sfx||{rise:'clunk',drop:'clunk',pop:'pop2',grow:u.water?'splash':'swish',fade:null}[u.anim]; if(s) ev.push({t:u.from+(u.anim==='drop'?.35:.05),s}); });
  ev.sort((a,b)=>a.t-b.t); const out=[]; ev.forEach(e=>{ const last=out[out.length-1]; if(last&&e.t-last.t<.08&&e.s===last.s) return; out.push(e); }); return out.map(e=>({...e,t:+e.t.toFixed(3)})); };
window.__AMBIENCE = CONFIG.ambience ? 'ambience' : null;

/* ---------- pemutar ---------- */
function fit(){ const s=Q.has('render')?1:Math.min(innerWidth/1080,innerHeight/1920); document.getElementById('stage').style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit(); if(Q.has('render')) document.body.classList.add('render');
let playing=false,t0=0,pos=0;
function loop(now){ if(!playing) return; pos=(now-t0)/1000; if(pos>=TOTAL){pos=TOTAL-.001;playing=false;document.getElementById('play').style.display='';} render(pos); requestAnimationFrame(loop); }
function play(){ if(pos>=TOTAL-.01) pos=0; playing=true; t0=performance.now()-pos*1000; document.getElementById('play').style.display='none'; requestAnimationFrame(loop); }
document.getElementById('play').onclick=play;
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();playing?(playing=false,document.getElementById('play').style.display=''):play();} if(e.code==='ArrowRight'){pos=Math.min(TOTAL-.01,pos+2);render(pos);} if(e.code==='ArrowLeft'){pos=Math.max(0,pos-2);render(pos);} });

window.__TOTAL=TOTAL;
window.__SCENES=TL.map(o=>({start:o.start,end:o.end,dur:o.end-o.start,minDur:o.s.minDur||0,big:o.s.say||o.s.type,vo:voText(o.s)}));
window.__seek=t=>render(t);
const logoLoad=new Promise(r=>{ const im=new Image(); im.onload=()=>{ LOGO_IMG=im; r(); }; im.onerror=()=>r(); im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO_SVG.replace('<svg ','<svg width="1040" height="300" ')); });
document.getElementById('logo').innerHTML=LOGO_SVG;
window.__ready=logoLoad.then(()=>Promise.all(["800 76px 'Plus Jakarta Sans'","600 120px 'Plus Jakarta Sans'","900 104px Poppins","600 36px Poppins"].map(f=>document.fonts.load(f).catch(()=>{}))))
  .then(()=>document.fonts.ready).then(()=>{ setup(); pos=Q.has('t')?+Q.get('t'):(Q.has('render')?0:1.5); render(pos); if(Q.has('autoplay')) play(); return TOTAL; });
</script>
